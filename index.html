<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --ink:#15201C; --inkSoft:#5C6B64; --rosa:#10A37B; --rosaDark:#15201C; --rosaSoft:#E4F6EF;
    --bg:#F2F7F5; --card:#FFFFFF; --line:#E3ECE8; --green:#0E9F6E; --greenSoft:#E1F4EA;
    --amber:#A86912; --amberSoft:#FAEBD4; --grey:#8A958F; --greySoft:#EDF2EF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:460px;margin:0 auto}
  .tnum{font-variant-numeric:tabular-nums}
  .hidden{display:none!important}
  input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:16px;outline-color:var(--rosa)}
  button{font-family:inherit;cursor:pointer;border:none}
  .lbl{font-size:14px;font-weight:500;color:var(--inkSoft);display:block;margin-bottom:4px}
  .fld{margin-bottom:16px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .btn{width:100%;padding:12px;border-radius:12px;font-weight:600}
  .btnR{background:var(--rosa);color:#fff}
  .btnG{background:var(--green);color:#fff}
  .btnGrey{background:var(--greySoft);color:var(--grey)}
  .btnOut{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .chip{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px}
  .mini{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;padding:6px 12px;border-radius:8px;background:var(--bg);color:var(--inkSoft)}
  .card{background:var(--card);border-radius:16px;border:1px solid var(--line);overflow:hidden;margin-bottom:12px}
  .modalbg{position:fixed;inset:0;background:rgba(26,22,38,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .modal{width:100%;max-width:460px;background:var(--card);border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto}
  .modalhd{position:sticky;top:0;background:var(--card);display:flex;align-items:center;justify-content:between;padding:18px 20px 10px;z-index:5}
  .loading{position:fixed;inset:0;background:rgba(245,242,245,.6);z-index:80;display:flex;align-items:center;justify-content:center}
  .spin{width:34px;height:34px;border:3px solid var(--rosaSoft);border-top-color:var(--rosa);border-radius:50%;animation:sp 0.7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  textarea{font-family:inherit}
  .itembox{background:var(--bg);border-radius:12px;padding:12px;margin-bottom:12px}
  /* ---- reportes de cobro (se convierten en imagen) ---- */
  .rep-card{width:520px;background:#fff;padding:14px 14px 16px;border:1px solid #e3e7ec;color:#232323;font-family:Arial,Helvetica,sans-serif}
  .rc-head{color:#C00000;font-weight:bold;font-size:18px;text-align:center;margin:2px 0 10px;line-height:1.15}
  .rc-band{display:flex;gap:12px;align-items:center;margin-bottom:14px}
  .rc-logo{width:66px;height:66px;flex:0 0 66px;border-radius:6px;background:#16233a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
  .rc-pick{flex:1;text-align:center;color:#5F5F5F;font-size:14.5px;line-height:1.32}
  .rc-namerow{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
  .rc-name{font-weight:bold;font-size:28px;color:#232323;flex:1;line-height:1.05}
  .rc-badge{font-weight:bold;font-size:14.5px;color:#fff;background:#E89640;padding:6px 11px;white-space:nowrap;display:flex;align-items:center}
  .rc-amt{font-weight:bold;font-size:14.5px;color:#232323;background:#FFD600;padding:6px 11px;white-space:nowrap;display:flex;align-items:center}
  table.rc-tbl{width:100%;border-collapse:collapse;font-size:16px;table-layout:fixed}
  table.rc-tbl th{background:#F4CBA0;color:#232323;border:1px solid #CBCBCB;padding:6px;text-align:center;font-size:14px}
  table.rc-tbl th.rc-thdesc{text-align:left}
  table.rc-tbl td{border:1px solid #CBCBCB;padding:7px;color:#232323;vertical-align:middle;height:34px}
  table.rc-tbl td.rc-qty,table.rc-tbl td.rc-cst,table.rc-tbl td.rc-sub{text-align:center}
  table.rc-tbl td.rc-desc{text-align:left;line-height:1.28;word-wrap:break-word;overflow-wrap:break-word}
  col.rc-cqty{width:56px}col.rc-ccst{width:66px}col.rc-csub{width:78px}
  .rc-foot{color:#5F5F5F;font-size:14.5px;text-align:center;line-height:1.34;margin:14px 4px 10px}
  .rc-foot u{text-decoration:underline}
  .rc-bank{text-align:center;color:#2E59A8;line-height:1.3}
  .rc-bank .rc-bt{font-weight:bold;font-size:17px;text-decoration:underline}
  .rc-bank .rc-bn{font-weight:bold;font-size:19px;margin-top:3px}
  .rc-bank .rc-ba{font-weight:bold;font-size:15px;margin-top:2px}
  /* packing labels */
  .plabel-prev,.plabel{color:#111;font-family:Arial,Helvetica,sans-serif}
  .phdr{background:#111;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:6px 12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pbrand{font-weight:800;font-size:14px;letter-spacing:.02em}
  .pdate{font-size:12px;font-weight:600}
  .pname{font-weight:800;font-size:22px;margin:8px 12px 0;line-height:1.05}
  .pcount{font-size:12px;color:#2E59A8;font-weight:600;margin:2px 12px 8px}
  .pitems{margin:0 12px}
  .pitem{font-size:14px;padding:5px 0;border-bottom:1px dashed #bbb}
  .pcb{color:#111}
  .pqty{color:#111;font-weight:800}
  .pdesc{color:#2E59A8}
  .pfoot{display:flex;justify-content:space-between;align-items:center;margin:8px 12px 12px;font-size:11px}
  .pfl{color:#2E59A8}
  .pfr{color:#111;font-weight:800}
  #print-root{display:none}
  @media print{
    .wrap,#modal-root,#loading{display:none!important}
    #print-root{display:block!important}
    .psheet{display:grid;grid-template-columns:1fr 1fr;gap:6mm}
    .plabel{border:1.5px solid #000;break-inside:avoid;page-break-inside:avoid;overflow:hidden}
    .plabel .pname{font-size:16pt}
    .plabel .pcount{font-size:8pt}
    .plabel .pitem{font-size:10.5pt;padding:1mm 0}
    .plabel .phdr{padding:2mm 3mm}
    .plabel .pbrand{font-size:11pt}
    .plabel .pdate{font-size:9pt}
    .plabel .pfoot{font-size:8pt;margin:3mm}
    @page{size:letter;margin:10mm}
  }
  .login-ov{position:fixed;inset:0;background:var(--bg);z-index:120;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 22px;box-shadow:0 10px 40px rgba(26,22,38,.08);text-align:center}
  .login-badge{width:56px;height:56px;border-radius:16px;background:var(--rosa);color:#fff;font-weight:800;font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  .login-title{font-weight:800;font-size:22px}
  .login-sub{color:var(--inkSoft);font-size:14px;margin:4px 0 20px}
  .login-card input{margin-bottom:12px}
  .login-btn{width:100%;padding:13px;border-radius:12px;background:var(--rosa);color:#fff;font-weight:700;font-size:15px}
  .login-btn:disabled{opacity:.6}
  .login-err{color:var(--rosaDark);font-size:13px;margin-top:10px;min-height:16px}
  .navbar{display:flex;gap:8px;padding:0 20px 14px;overflow-x:auto}
  .navbtn{flex:0 0 auto;white-space:nowrap;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--inkSoft);font-weight:600;font-size:14px;cursor:pointer}
  .navbtn-on{background:var(--rosa);color:#fff;border-color:var(--rosa)}
  .login-logo{width:76px;height:76px;object-fit:contain;border-radius:18px;margin:0 auto 14px;display:block}
  .login-credit{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);color:var(--grey);font-size:12px}
  .iapp-logo{height:18px;width:auto;object-fit:contain;vertical-align:middle}
  .credit-bar{max-width:460px;margin:6px auto 26px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;color:var(--grey);font-size:12px}
  @media(min-width:768px){ body{zoom:1.12;} .wrap{max-width:760px;} .modal{max-width:520px;} .navbar{flex-wrap:wrap;overflow-x:visible;justify-content:center} .credit-bar{max-width:760px} }
  @media(min-width:1200px){ body{zoom:1.17;} .wrap{max-width:820px;} }
</style>

function mxn(n){n=Number(n)||0;return '$'+n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function fmtDate(iso){if(!iso)return '';var p=String(iso).split('-');if(p.length<3)return String(iso);return p[2]+'/'+p[1]+'/'+p[0].slice(2);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function itemImp(it){return Number(it.importe)||(Number(it.cantidad)||0)*(Number(it.precioUnit)||0);}
function pedTotal(p){return (p.items||[]).reduce(function(s,it){return s+itemImp(it);},0);}
function pedPagado(p){return STATE.pagos.filter(function(g){return g.pedidoId===p.id;}).reduce(function(s,g){return s+(Number(g.monto)||0);},0);}
function pedVista(p){var t=pedTotal(p),pg=pedPagado(p),sal=t-pg;var e='Pendiente';if(p.cancelado)e='Cancelado';else if(sal<=0.001)e='Pagado';else if(pg>0)e='Parcial';return{total:t,pagado:pg,saldo:sal,estatus:e};}
function estStyle(e){return {Pendiente:['var(--rosaSoft)','var(--rosaDark)'],Parcial:['var(--amberSoft)','var(--amber)'],Pagado:['var(--greenSoft)','var(--green)'],Cancelado:['var(--greySoft)','var(--grey)']}[e];}
function byId(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null;}
function clienteTel(nombre){var n=(nombre||'').trim().toLowerCase();for(var i=0;i<STATE.clientes.length;i++)if(STATE.clientes[i].nombre.toLowerCase()===n)return STATE.clientes[i].telefono;return '';}
function prodPrecio(nombre){var n=(nombre||'').trim().toLowerCase();for(var i=0;i<STATE.productos.length;i++)if(STATE.productos[i].nombre.toLowerCase()===n)return STATE.productos[i].precio;return null;}

function hideLoading(){document.getElementById('loading').classList.add('hidden');}

function findOrCreateCliente(nombre,telefono,force){
  nombre=(nombre||'').trim(); if(!nombre) return Promise.resolve(null);
  var key=nombre.toLowerCase();
  if(CLI_ID_BY_NAME[key]){
    var id=CLI_ID_BY_NAME[key];
    if(telefono){var cur=(CLI_BY_ID[id]&&CLI_BY_ID[id].telefono)||'';if(force||!cur){return sb.from('clientes').update({telefono:telefono}).eq('id',id).then(function(){if(CLI_BY_ID[id])CLI_BY_ID[id].telefono=telefono;return id;});}}
    return Promise.resolve(id);
  }
  return sb.from('clientes').insert({nombre:nombre,telefono:telefono||null}).select('id').single().then(function(r){if(r.error)throw r.error;CLI_ID_BY_NAME[key]=r.data.id;CLI_BY_ID[r.data.id]={nombre:nombre,telefono:telefono||''};return r.data.id;});
}
function findOrCreateProducto(nombre,precio){
  nombre=(nombre||'').trim(); if(!nombre) return Promise.resolve();
  var key=nombre.toLowerCase();
  if(PROD_NAMES[key]) return Promise.resolve();
  return sb.from('productos').insert({nombre:nombre,precio:(precio==null?null:Number(precio)),categoria:''}).then(function(r){if(r.error&&String(r.error.code)!=='23505')throw r.error;PROD_NAMES[key]=true;});
}
function chainProductos(items){return items.reduce(function(pr,it){return pr.then(function(){var pu=(it.precioUnit==null||it.precioUnit==='')?null:Number(it.precioUnit);return findOrCreateProducto((it.concepto||'').trim(),pu);});},Promise.resolve());}

  return findOrCreateCliente((p.cliente||'').trim(),(p.telefono||'').trim(),false).then(function(cliId){
    var pedPromise=existing?Promise.resolve(existing.id):sb.from('pedidos').insert({folio:nextFolio(),periodo:(p.periodo||'').trim(),fecha:todayISO(),cliente_id:cliId,lugar_entrega:((p.lugar||'').trim()||null),entregado:false,cancelado:false,created_by:(p.by||null)}).select('id').single().then(function(r){if(r.error)throw r.error;return r.data.id;});
    return pedPromise.then(function(pedidoId){

      var ins=rows.length?sb.from('pedido_items').insert(rows).then(function(r){if(r.error)throw r.error;}):Promise.resolve();

    });
  });

function run(fn,args,cb){
  showLoading();
  var op=OPS[fn];
  var pr=op?op.apply(null,args||[]):Promise.reject(new Error('Operacion desconocida: '+fn));
  pr.then(function(){return loadAll();}).then(function(){hideLoading();READY=true;if(cb)cb();render();}).catch(function(err){hideLoading();alert('Error: '+((err&&err.message)?err.message:err));});
}

function loadAll(){
  return Promise.all([
    sb.from('clientes').select('id,nombre,telefono').limit(10000),
    sb.from('productos').select('nombre,precio,categoria').limit(10000),
    sb.from('pedidos').select('id,folio,periodo,fecha,cliente_id,lugar_entrega,entregado,cancelado,created_at,created_by').order('folio',{ascending:false}).limit(10000),
    sb.from('pedido_items').select('id,pedido_id,producto,cantidad,precio_unit,importe').limit(20000),
    sb.from('pagos').select('id,pedido_id,fecha,monto,metodo,created_at,created_by').limit(20000),
    sb.from('pendientes').select('id,fecha,cliente_id,producto,tienda,notas,comprado,created_at,created_by').limit(10000),
    sb.from('costos').select('*').limit(10000),
    sb.from('gastos').select('*').limit(10000),
    sb.from('agenda').select('id,fecha,tipo,lugar,notas,periodo,created_at,created_by').limit(10000),
    sb.from('transferencias').select('*').limit(20000)
  ]).then(function(q){
    for(var i=0;i<q.length;i++){if(q[i].error)throw q[i].error;}
    var clientesRaw=q[0].data||[],productosRaw=q[1].data||[],pedRaw=q[2].data||[],itemsRaw=q[3].data||[],pagosRaw=q[4].data||[],pendRaw=q[5].data||[],costosRaw=q[6].data||[],gastosRaw=q[7].data||[],agendaRaw=q[8].data||[],transRaw=q[9].data||[];
    CLI_BY_ID={};CLI_ID_BY_NAME={};PROD_NAMES={};
    clientesRaw.forEach(function(c){CLI_BY_ID[c.id]={nombre:c.nombre||'',telefono:c.telefono||''};if(c.nombre)CLI_ID_BY_NAME[String(c.nombre).toLowerCase()]=c.id;});
    productosRaw.forEach(function(p){if(p.nombre)PROD_NAMES[String(p.nombre).toLowerCase()]=true;});
    var ms=function(t){return t?new Date(t).getTime():0;};
    var itemsByPed={};
    itemsRaw.forEach(function(it){(itemsByPed[it.pedido_id]=itemsByPed[it.pedido_id]||[]).push({id:String(it.id),concepto:String(it.producto||''),cantidad:Number(it.cantidad)||0,precioUnit:(it.precio_unit==null?null:Number(it.precio_unit)),importe:Number(it.importe)||0});});
    var pedById={};
    var pedidos=pedRaw.map(function(r){var cli=CLI_BY_ID[r.cliente_id]||{nombre:'',telefono:''};var o={id:String(r.id),folio:r.folio||'',periodo:r.periodo||'',fecha:r.fecha||'',cliente:cli.nombre,telefono:cli.telefono||'',entregado:!!r.entregado,cancelado:!!r.cancelado,createdAt:ms(r.created_at),by:r.created_by||'',lugar:r.lugar_entrega||'',items:itemsByPed[r.id]||[]};pedById[o.id]=o;return o;});
    var pagos=pagosRaw.map(function(r){var ped=pedById[r.pedido_id]||{};return {id:String(r.id),pedidoId:String(r.pedido_id),folio:ped.folio||'',periodo:ped.periodo||'',fecha:r.fecha||'',cliente:ped.cliente||'',monto:Number(r.monto)||0,metodo:r.metodo||'',by:r.created_by||''};});
    var clientes=clientesRaw.map(function(c){return {nombre:c.nombre||'',telefono:c.telefono||''};}).filter(function(x){return x.nombre;});
    var productos=productosRaw.map(function(p){return {nombre:p.nombre||'',precio:(p.precio==null?null:Number(p.precio)),categoria:p.categoria||''};}).filter(function(x){return x.nombre;});
    var pendientes=pendRaw.map(function(r){var cli=CLI_BY_ID[r.cliente_id]||{nombre:''};return {id:String(r.id),fecha:r.fecha||'',cliente:cli.nombre||'',producto:String(r.producto||''),tienda:String(r.tienda||''),notas:String(r.notas||''),comprado:!!r.comprado,createdAt:ms(r.created_at),by:r.created_by||''};}).filter(function(x){return x.producto;});
    var costos=costosRaw.map(function(r){return {id:String(r.id),fecha:r.fecha||'',periodo:r.periodo||'',tipo:r.tipo||'ticket',tienda:r.tienda||'',subUSD:Number(r.subtotal_usd)||0,taxUSD:Number(r.taxes_usd)||0,totalUSD:Number(r.total_usd)||0,tc:Number(r.tc)||0,mxn:Number(r.costo_mxn)||0,num:(r.num_productos==null?'':Number(r.num_productos)),notas:r.notas||'',createdAt:ms(r.created_at),by:r.created_by||''};});
    var gastos=gastosRaw.map(function(r){return {id:String(r.id),fecha:r.fecha||'',periodo:r.periodo||'',categoria:r.categoria||'',moneda:r.moneda||'MXN',monto:Number(r.monto)||0,tc:Number(r.tc)||0,mxn:Number(r.monto_mxn)||0,notas:r.notas||'',createdAt:ms(r.created_at),by:r.created_by||''};});
    var agenda=agendaRaw.map(function(r){return {id:String(r.id),fecha:r.fecha||'',tipo:r.tipo||'',lugar:r.lugar||'',notas:r.notas||'',periodo:r.periodo||'',createdAt:ms(r.created_at),by:r.created_by||''};}).filter(function(x){return x.fecha;});
    var transferencias=transRaw.map(function(r){return {id:String(r.id),fecha:r.fecha||'',monto:Number(r.monto)||0,remitente:r.remitente||'',cuentaOrigen:r.cuenta_origen||'',concepto:r.concepto||'',referencia:r.referencia||'',institucion:r.institucion||'',clave:r.clave_rastreo||'',estatus:r.estatus||'pendiente',pedidoId:r.pedido_id||'',pagoId:r.pago_id||'',createdAt:ms(r.created_at)};}).filter(function(x){return x.clave||x.monto;});
    STATE={pedidos:pedidos,pagos:pagos,clientes:clientes,productos:productos,pendientes:pendientes,costos:costos,gastos:gastos,agenda:agenda,transferencias:transferencias};
  });
}

function buildReport(activos){
  var map={},order=[];
  activos.forEach(function(p){
    var v=pedVista(p);
    if(!map[p.cliente]){map[p.cliente]={cliente:p.cliente,telefono:p.telefono||'',peds:[],totalSaldo:0,totalPagado:0,pendientes:0};order.push(p.cliente);}
    var m=map[p.cliente];
    m.peds.push({id:p.id,folio:p.folio,periodo:p.periodo,total:v.total,pagado:v.pagado,saldo:v.saldo,estatus:v.estatus});
    m.totalSaldo+=Math.max(0,v.saldo);m.totalPagado+=v.pagado;if(v.saldo>0.001)m.pendientes+=1;if(p.telefono)m.telefono=p.telefono;
  });
  var out=order.map(function(n){var m=map[n];if(!m.telefono)m.telefono=clienteTel(n);m.peds.sort(function(a,b){return (a.periodo||'').localeCompare(b.periodo||'');});return m;});
  out.sort(function(a,b){return b.totalSaldo-a.totalSaldo;});
  return out;
}
function renderReport(report){

  var _herob='<div style="margin-bottom:14px;padding:18px;background:var(--ink);border-radius:20px"><div style="color:#C9BFD6;font-size:13px;font-weight:500">Por cobrar</div><div class="tnum" style="font-size:34px;font-weight:800;color:#fff;letter-spacing:-.02em">'+mxn(_pcb)+'</div><div style="color:#C9BFD6;font-size:13px;margin-top:2px"><b style="color:#fff">'+_npb+'</b> pedidos &nbsp; <b style="color:#fff">'+_ncb+'</b> clientes</div></div>';

function waLink(nombre,tel,saldo,pend){var t=(tel||'').replace(/\D/g,'');var num=t.length===10?'52'+t:t;return 'https://wa.me/'+num+'?text='+encodeURIComponent(fillWa(waMsg(),nombre,saldo,pend));}

/* ---------- ventas y cobranza ---------- */
function kpi(label,val,color){return '<div class="card" style="padding:12px 8px;text-align:center;margin:0"><div style="font-size:11px;color:var(--inkSoft)">'+label+'</div><div class="tnum" style="font-size:16px;font-weight:800;color:'+color+';margin-top:2px">'+mxn(val)+'</div></div>';}
function kpiG(label,val,margen){return '<div class="card" style="padding:12px 8px;text-align:center;margin:0"><div style="font-size:11px;color:var(--inkSoft)">'+label+'</div><div class="tnum" style="font-size:16px;font-weight:800;color:'+(val>=0?'var(--green)':'var(--rosaDark)')+';margin-top:2px">'+mxn(val)+'</div><div style="font-size:10px;color:var(--inkSoft)">'+margen+'% margen</div></div>';}
function blankP(k){return {periodo:k,vendido:0,cobrado:0,pendiente:0,pedidos:0,clientes:{},costos:0,gastos:0};}
function renderVentas(){
  var activos=STATE.pedidos.filter(function(p){return !p.cancelado;});
  var vendido=0;activos.forEach(function(p){vendido+=pedTotal(p);});
  var cobrado=STATE.pagos.reduce(function(s,g){return s+(Number(g.monto)||0);},0);
  var porCobrar=activos.reduce(function(s,p){return s+Math.max(0,pedVista(p).saldo);},0);
  var costosT=(STATE.costos||[]).reduce(function(s,x){return s+(Number(x.mxn)||0);},0);
  var gastosT=(STATE.gastos||[]).reduce(function(s,x){return s+(Number(x.mxn)||0);},0);
  var ganancia=vendido-costosT-gastosT;var margen=vendido>0?Math.round(ganancia/vendido*100):0;
  var pm={},order=[];
  function perOf(x){return x.periodo||'(sin periodo)';}
  activos.forEach(function(p){var k=perOf(p);if(!pm[k]){pm[k]=blankP(k);order.push(k);}var v=pedVista(p);pm[k].vendido+=v.total;pm[k].cobrado+=v.pagado;pm[k].pendiente+=Math.max(0,v.saldo);pm[k].pedidos+=1;pm[k].clientes[p.cliente]=1;});
  (STATE.costos||[]).forEach(function(x){var k=perOf(x);if(!pm[k]){pm[k]=blankP(k);order.push(k);}pm[k].costos+=(Number(x.mxn)||0);});
  (STATE.gastos||[]).forEach(function(x){var k=perOf(x);if(!pm[k]){pm[k]=blankP(k);order.push(k);}pm[k].gastos+=(Number(x.mxn)||0);});
  var pers=order.map(function(k){return pm[k];}).sort(function(a,b){return a.periodo.localeCompare(b.periodo,'es');});
  var met={};STATE.pagos.forEach(function(g){var m=g.metodo||'Otro';met[m]=(met[m]||0)+(Number(g.monto)||0);});
  var h='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">'+kpi('Vendido',vendido,'var(--ink)')+kpi('Cobrado',cobrado,'var(--green)')+kpi('Por cobrar',porCobrar,'var(--rosaDark)')+'</div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">'+kpi('Costos',costosT,'var(--amber)')+kpi('Gastos',gastosT,'var(--amber)')+kpiG('Ganancia',ganancia,margen)+'</div>';
  h+='<div style="font-size:13px;font-weight:700;color:var(--inkSoft);margin-bottom:8px">Por periodo</div>';
  pers.forEach(function(pp){
    var nc=Object.keys(pp.clientes).length;var pct=pp.vendido>0?Math.round(pp.cobrado/pp.vendido*100):0;if(pct>100)pct=100;
    var g=pp.vendido-pp.costos-pp.gastos;var mg=pp.vendido>0?Math.round(g/pp.vendido*100):0;
    h+='<div class="card" style="padding:12px 14px">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:700">'+esc(pp.periodo)+'</span><span style="font-size:12px;color:var(--inkSoft)">'+pp.pedidos+' pedidos &middot; '+nc+' clientes</span></div>';
    h+='<div style="display:flex;justify-content:space-between;margin-top:6px;font-size:13px"><span style="color:var(--inkSoft)">Vendido <b class="tnum" style="color:var(--ink)">'+mxn(pp.vendido)+'</b></span><span style="color:var(--inkSoft)">Cobrado <b class="tnum" style="color:var(--green)">'+mxn(pp.cobrado)+'</b></span></div>';
    h+='<div style="height:8px;background:var(--greySoft);border-radius:999px;margin-top:8px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:var(--green)"></div></div>';

var PEND_TIENDA='', PEND_SHOW='pend';

function renderPendientes(){
  var items=(STATE.pendientes||[]).slice();

  var comp=items.filter(function(x){return x.comprado;});
  var list=(PEND_SHOW==='comp')?comp:pend;

  order.sort();

    h+='<div style="font-size:12px;font-weight:700;color:var(--inkSoft);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.03em">'+esc(t)+' <span style="color:var(--grey)">('+groups[t].length+')</span></div>';

      h+='<button onclick="doDelPend(\''+x.id+'\')" style="background:none;color:var(--grey)">&times;</button></div></div>';
    });
  });

function gsMxn(){if(GS_MON!=='USD')return;var monto=Number(val('gs-monto'))||0,tc=Number(val('gs-tc'))||0;var el=document.getElementById('gs-mxn');if(el)el.textContent=mxn(monto*tc);}
function submitGasto(){
  var monto=Number(val('gs-monto'))||0;
  if(monto<=0){alert('Falta el monto.');return;}
  var mon=GS_MON,tc=mon==='USD'?(Number(val('gs-tc'))||0):0;
  if(mon==='USD'&&tc<=0){alert('Falta el tipo de cambio.');return;}
  if(mon==='USD')saveLastTC(tc);
  var payload={categoria:val('gs-cat'),moneda:mon,monto:monto,tc:tc,mxn:mon==='USD'?monto*tc:monto,fecha:val('gs-fecha')||todayISO(),periodo:val('gs-periodo').trim(),notas:val('gs-notas').trim(),by:ME};
  closeModal();run('addGasto',[payload],null);
}

/* ---------- productos view / agenda / lugar / multi-add ---------- */
var PED_MODE='pedidos', PROD_PER='', PROD_Q='', AG_PER='';
function pedMode(m){PED_MODE=m;render();}
function fillLugares(){var o={},out=[];(STATE.pedidos||[]).forEach(function(p){if(p.lugar&&!o[p.lugar]){o[p.lugar]=1;out.push(p.lugar);}});(STATE.agenda||[]).forEach(function(a){if(a.lugar&&!o[a.lugar]){o[a.lugar]=1;out.push(a.lugar);}});out.sort();var dl=document.getElementById('dl-lugares');if(dl)dl.innerHTML=out.map(function(l){return '<option value="'+esc(l)+'">';}).join('');}
function upcomingAgenda(n){var t=todayISO();var arr=(STATE.agenda||[]).filter(function(a){return a.fecha>=t;}).sort(function(a,b){return a.fecha.localeCompare(b.fecha);});return n?arr.slice(0,n):arr;}
function prodAgg(){
  var peds=STATE.pedidos.filter(function(p){return !p.cancelado&&p.periodo===PROD_PER;});
  var prod={},order=[];
  peds.forEach(function(p){(p.items||[]).forEach(function(it){var k=(it.concepto||'').trim();if(!k)return;var kk=k.toLowerCase();if(!prod[kk]){prod[kk]={nombre:k,total:0,buyers:{}};order.push(kk);}prod[kk].total+=Number(it.cantidad)||0;prod[kk].buyers[p.cliente]=(prod[kk].buyers[p.cliente]||0)+(Number(it.cantidad)||0);});});
  return order.map(function(k){return prod[k];});
}
function prodListHTML(){
  var q=PROD_Q.trim().toLowerCase();
  var list=prodAgg().filter(function(x){return !q||x.nombre.toLowerCase().indexOf(q)>=0;}).sort(function(a,b){return a.nombre.localeCompare(b.nombre,'es');});
  if(!list.length)return '<div style="text-align:center;color:var(--inkSoft);padding:24px">Sin productos.</div>';
  var h='<div style="font-size:12px;color:var(--inkSoft);margin-bottom:8px">'+list.length+' productos distintos</div>';
  list.forEach(function(x){var bs=Object.keys(x.buyers).sort(function(a,b){return a.localeCompare(b,'es');});h+='<div class="card" style="padding:12px 14px"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><span style="font-weight:600;min-width:0">'+esc(x.nombre)+'</span><span style="flex:0 0 auto;font-weight:700;color:var(--rosaDark)">'+x.total+' pza'+(x.total===1?'':'s')+'</span></div><div style="font-size:12px;color:var(--inkSoft);margin-top:4px">'+bs.map(function(c){return esc(c)+' ('+x.buyers[c]+')';}).join(' &middot; ')+'</div></div>';});
  return h;
}
function renderProductosView(){
  var ps=periodos();
  if(!ps.length)return emptyBox('Sin periodos','Registra pedidos primero.');
  if(!PROD_PER||ps.indexOf(PROD_PER)<0)PROD_PER=defaultPeriodo()||ps[0]||'';
  var h='<div style="margin-bottom:12px"><select onchange="prodPer(this.value)">'+ps.map(function(p){return '<option value="'+esc(p)+'"'+(p===PROD_PER?' selected':'')+'>'+esc(p)+'</option>';}).join('')+'</select></div>';
  h+='<div style="margin-bottom:12px"><input id="prod-q" value="'+esc(PROD_Q)+'" oninput="prodQ(this.value)" placeholder="Buscar producto..." style="background:#fff"></div>';
  h+='<div id="prod-list">'+prodListHTML()+'</div>';
  return h;
}
function prodPer(v){PROD_PER=v;render();}
function prodQ(v){PROD_Q=v;var el=document.getElementById('prod-list');if(el)el.innerHTML=prodListHTML();}
function renderAgenda(){
  var ps=periodos();var t=todayISO();
  var up=(STATE.agenda||[]).slice().sort(function(a,b){return a.fecha.localeCompare(b.fecha);});
  var h='<button class="btn btnR" style="margin-bottom:12px" onclick="openAgenda()">+ Nueva fecha</button>';
  h+='<div style="font-size:13px;font-weight:700;color:var(--inkSoft);margin-bottom:8px">Fechas</div>';
  if(!up.length)h+=emptyBox('Sin fechas','Agrega entregas, visitas a tiendas, etc.');
  else up.forEach(function(a){var past=a.fecha<t;h+='<div class="card" style="padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;opacity:'+(past?'.55':'1')+'"><div style="min-width:0"><div style="font-weight:600">'+fmtDate(a.fecha)+' &middot; '+esc(a.tipo)+'</div><div style="font-size:12px;color:var(--inkSoft)">'+(a.lugar?esc(a.lugar):'')+(a.periodo?' &middot; '+esc(a.periodo):'')+(a.notas?' &middot; '+esc(a.notas):'')+'</div></div><button onclick="doDelAgenda(\''+a.id+'\')" style="background:none;color:var(--grey);flex:0 0 auto">&times;</button></div>';});
  h+='<div style="font-size:13px;font-weight:700;color:var(--inkSoft);margin:16px 0 8px">Entregas por lugar</div>';
  if(!ps.length)return h+'<div style="color:var(--inkSoft);font-size:13px">Registra pedidos para ver esto.</div>';
  if(!AG_PER||ps.indexOf(AG_PER)<0)AG_PER=defaultPeriodo()||ps[0]||'';
  h+='<div style="margin-bottom:12px"><select onchange="agPer(this.value)">'+ps.map(function(p){return '<option value="'+esc(p)+'"'+(p===AG_PER?' selected':'')+'>'+esc(p)+'</option>';}).join('')+'</select></div>';
  var peds=STATE.pedidos.filter(function(p){return !p.cancelado&&p.periodo===AG_PER;});
  var lug={},lorder=[];
  peds.forEach(function(p){var l=p.lugar||'(sin lugar)';if(!lug[l]){lug[l]={};lorder.push(l);}lug[l][p.cliente]=1;});
  lorder.sort();
  if(!lorder.length)h+='<div style="color:var(--inkSoft);font-size:13px">Sin pedidos en este periodo.</div>';
  lorder.forEach(function(l){var cs=Object.keys(lug[l]).sort(function(a,b){return a.localeCompare(b,'es');});h+='<div class="card" style="padding:12px 14px"><div style="font-weight:700">'+esc(l)+' <span style="color:var(--grey);font-weight:400;font-size:13px">('+cs.length+')</span></div><div style="font-size:13px;color:var(--inkSoft);margin-top:4px">'+cs.map(function(c){return esc(c);}).join(' &middot; ')+'</div></div>';});
  return h;
}
function agPer(v){AG_PER=v;render();}
function openAgenda(){
  fillLugares();var per=defaultPeriodo();
  var h='<div class="fld"><label class="lbl">Fecha</label><input id="ag-fecha" type="date" value="'+todayISO()+'"></div>';
  h+='<div class="fld"><label class="lbl">Tipo</label><select id="ag-tipo"><option>Entrega</option><option>Visita a tienda</option><option>Otro</option></select></div>';
  h+='<div class="fld"><label class="lbl">Lugar</label><input id="ag-lugar" list="dl-lugares" placeholder="San Pedro, Walmart Laredo, etc."></div>';
  h+='<div class="fld"><label class="lbl">Periodo (opcional)</label><input id="ag-per" list="dl-per" value="'+esc(per)+'"></div>';
  h+='<div class="fld"><label class="lbl">Notas (opcional)</label><input id="ag-notas"></div>';
  h+='<button class="btn btnR" onclick="submitAgenda()">Guardar fecha</button>';
  openModal('Nueva fecha',h);
}
function submitAgenda(){
  var payload={fecha:val('ag-fecha')||todayISO(),tipo:val('ag-tipo')||'Entrega',lugar:val('ag-lugar').trim(),periodo:val('ag-per').trim(),notas:val('ag-notas').trim(),by:ME};
  if(!payload.fecha){alert('Elige una fecha.');return;}
  closeModal();run('addAgenda',[payload],null);
}
function doDelAgenda(id){if(confirm('Eliminar esta fecha?'))run('deleteAgenda',[id],null);}
function openAddItems(pedidoId){
  window._addItemsPed=pedidoId;
  FORM_ITEMS=[{concepto:'',cantidad:'1',precioUnit:''}];
  var h='<label class="lbl">Productos a agregar</label><div id="items-box">'+renderFormItems()+'</div>';
  h+='<button class="btn btnR" style="margin-top:8px" onclick="submitAddItems()">Agregar al pedido</button>';
  openModal('Agregar productos',h);
}
function submitAddItems(){
  var items=FORM_ITEMS.filter(function(it){return it.concepto.trim()&&(Number(it.cantidad)||0)*(Number(it.precioUnit)||0)>0;}).map(function(it){return {concepto:it.concepto.trim(),cantidad:Number(it.cantidad)||1,precioUnit:Number(it.precioUnit)||0};});
  if(!items.length){alert('Agrega al menos un producto con precio.');return;}
  var pid=window._addItemsPed;
  closeModal();run('addItems',[pid,items],null);
}

/* ---------- banco / transferencias ---------- */
var ASG_TID='', ASG_AMT=0, ASG_CLI='';
function revisarTransfers(){
  showLoading();
  loadAll().then(function(){hideLoading();render();var n=(STATE.transferencias||[]).filter(function(t){return (t.estatus||'pendiente')==='pendiente';}).length;alert(n>0?(n+' transferencia(s) pendiente(s) por asignar.'):'Todo al dia: no hay transferencias pendientes. (Se importan solas cada 15 min.)');}).catch(function(e){hideLoading();alert('Error al actualizar: '+((e&&e.message)?e.message:e));});
}
function renderTransferencias(){
  var trs=(STATE.transferencias||[]);
  var pend=trs.filter(function(t){return t.estatus==='pendiente';}).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
  var asig=trs.filter(function(t){return t.estatus==='asignado';}).length;
  var h='<button class="btn btnR" style="margin-bottom:6px" onclick="revisarTransfers()">&#128229; Revisar transferencias</button>';
  h+='<div style="font-size:12px;color:var(--inkSoft);margin-bottom:14px">Trae los avisos de BANREGIO reenviados a tu Gmail. Luego asigna cada uno a su pedido.</div>';
  h+='<div style="font-size:13px;font-weight:700;color:var(--inkSoft);margin-bottom:8px">Por asignar ('+pend.length+')</div>';
  if(!pend.length)h+=emptyBox('Nada por asignar','Dale "Revisar transferencias" para traer las nuevas.');
  else pend.forEach(function(t){
    h+='<div class="card" style="padding:12px 14px">';
    h+='<div style="display:flex;justify-content:space-between;align-items:baseline"><span class="tnum" style="font-weight:800;font-size:16px">'+mxn(t.monto)+'</span><span style="font-size:12px;color:var(--inkSoft)">'+fmtDate(t.fecha)+'</span></div>';
    h+='<div style="font-size:13px;color:var(--ink);margin-top:2px;font-weight:600">'+esc(t.remitente||'(sin nombre)')+'</div>';
    h+='<div style="font-size:12px;color:var(--inkSoft)">'+(t.institucion?esc(t.institucion):'')+(t.concepto?(' &middot; concepto: '+esc(t.concepto)):'')+(t.referencia?(' &middot; ref: '+esc(t.referencia)):'')+'</div>';
    h+='<div style="display:flex;gap:8px;margin-top:10px;align-items:center"><button class="btn btnG" style="flex:1;padding:8px" onclick="openAsignar(\''+t.id+'\')">Asignar a pedido</button><button class="mini" style="color:var(--amber)" onclick="doIgnorar(\''+t.id+'\')">Ignorar</button></div>';
    h+='</div>';
  });
  h+='<div style="font-size:12px;color:var(--inkSoft);margin-top:14px">'+asig+' transferencia(s) ya asignada(s).</div>';
  return h;
}
function doIgnorar(id){if(confirm('Marcar como ignorada? (no se asignara a ningun pedido)'))run('ignorarTransferencia',[id],null);}
function norm(x){return String(x||'').toUpperCase().replace(/[ÁÀÄÂ]/g,'A').replace(/[ÉÈËÊ]/g,'E').replace(/[ÍÌÏÎ]/g,'I').replace(/[ÓÒÖÔ]/g,'O').replace(/[ÚÙÜÛ]/g,'U').replace(/Ñ/g,'N').replace(/[^A-Z0-9 ]/g,' ').split(/\s+/).filter(function(w){return w.length>=3;});}
function suggestClient(remitente,clientes){var rw=norm(remitente);if(!rw.length)return '';var best='',bs=0;clientes.forEach(function(c){var cw=norm(c),sc=0;cw.forEach(function(w){if(rw.indexOf(w)>=0)sc++;});if(sc>bs){bs=sc;best=c;}});return bs>0?best:'';}
function asgClientes(){var pend=pedidosConSaldo();var cl=[];pend.forEach(function(p){if(cl.indexOf(p.cliente)<0)cl.push(p.cliente);});cl.sort(function(a,b){return a.localeCompare(b,'es');});return cl;}
function openAsignar(tid){
  var t=byId(STATE.transferencias,tid);if(!t)return;
  var cl=asgClientes();
  if(!cl.length){alert('No hay pedidos con saldo pendiente para asignar.');return;}
  ASG_TID=tid;ASG_AMT=t.monto;window._asgT=t;
  ASG_CLI=suggestClient(t.remitente,cl)||cl[0]||'';
  openModal('Asignar transferencia',asignarBody());
}
function asignarBody(){
  var t=window._asgT;var cl=asgClientes();
  var peds=pedidosConSaldo().filter(function(p){return p.cliente===ASG_CLI;});
  var sug=null;peds.forEach(function(p){if(Math.abs(p.saldo-ASG_AMT)<0.5)sug=p;});
  var pedId=sug?sug.id:(peds[0]?peds[0].id:'');
  var h='<div style="background:var(--greenSoft);border-radius:12px;padding:10px 12px;margin-bottom:14px"><div class="tnum" style="font-weight:800;font-size:16px;color:var(--green)">'+mxn(t.monto)+'</div><div style="font-size:13px;color:var(--ink);font-weight:600">'+esc(t.remitente||'')+'</div><div style="font-size:12px;color:var(--inkSoft)">'+fmtDate(t.fecha)+(t.institucion?' &middot; '+esc(t.institucion):'')+'</div></div>';
  h+='<div class="fld"><label class="lbl">Cliente'+(suggestClient(t.remitente,cl)?' (sugerido por nombre)':'')+'</label><select id="asg-cli" onchange="asgCli()">'+cl.map(function(c){return '<option'+(c===ASG_CLI?' selected':'')+'>'+esc(c)+'</option>';}).join('')+'</select></div>';
  h+='<div class="fld"><label class="lbl">Pedido a abonar</label><select id="asg-ped">'+peds.map(function(p){return '<option value="'+p.id+'"'+(p.id===pedId?' selected':'')+'>'+esc(p.folio)+' &middot; '+esc(p.periodo)+' &middot; saldo '+mxn(p.saldo)+'</option>';}).join('')+'</select></div>';
  h+='<div class="row2"><div class="fld"><label class="lbl">Monto</label><input id="asg-monto" inputmode="decimal" value="'+t.monto+'"></div><div class="fld"><label class="lbl">Fecha</label><input id="asg-fecha" type="date" value="'+((t.fecha&&t.fecha.length===10)?t.fecha:todayISO())+'"></div></div>';
  h+='<button class="btn btnG" onclick="submitAsignar()">Registrar pago y marcar asignada</button>';
  return h;
}
function asgCli(){ASG_CLI=document.getElementById('asg-cli').value;var box=document.querySelector('#modal-root .modal > div:last-child');if(box)box.innerHTML=asignarBody();}
function submitAsignar(){
  var pedId=val('asg-ped');
  var monto=Number(val('asg-monto'))||0;
  var fecha=val('asg-fecha')||todayISO();
  if(!pedId||monto<=0){alert('Elige un pedido y un monto valido.');return;}
  closeModal();
  run('asignarTransferencia',[ASG_TID,pedId,monto,fecha],null);
}

window.addEventListener('load',bootAuth);
</script>
