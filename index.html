<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#15201C; --inkSoft:#5C6B64; --rosa:#10A37B; --rosaDark:#15201C; --rosaSoft:#E4F6EF;
    --bg:#F2F7F5; --card:#FFFFFF; --line:#E3ECE8; --green:#0E9F6E; --greenSoft:#E1F4EA;
    --amber:#A86912; --amberSoft:#FAEBD4; --grey:#8A958F; --greySoft:#EDF2EF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:460px;margin:0 auto}
  .tnum{font-variant-numeric:tabular-nums}
  .hidden{display:none!important}
  input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:16px;outline-color:var(--rosa)}
  button{font-family:inherit;cursor:pointer;border:none}
  .lbl{font-size:14px;font-weight:500;color:var(--inkSoft);display:block;margin-bottom:4px}
  .fld{margin-bottom:16px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .btn{width:100%;padding:12px;border-radius:12px;font-weight:600}
  .btnR{background:var(--rosa);color:#fff}
  .btnG{background:var(--green);color:#fff}
  .btnGrey{background:var(--greySoft);color:var(--grey)}
  .btnOut{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .chip{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px}
  .mini{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;padding:6px 12px;border-radius:8px;background:var(--bg);color:var(--inkSoft)}
  .card{background:var(--card);border-radius:16px;border:1px solid var(--line);overflow:hidden;margin-bottom:12px}
  .modalbg{position:fixed;inset:0;background:rgba(26,22,38,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .modal{width:100%;max-width:460px;background:var(--card);border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto}
  .modalhd{position:sticky;top:0;background:var(--card);display:flex;align-items:center;justify-content:between;padding:18px 20px 10px;z-index:5}
  .loading{position:fixed;inset:0;background:rgba(245,242,245,.6);z-index:80;display:flex;align-items:center;justify-content:center}
  .spin{width:34px;height:34px;border:3px solid var(--rosaSoft);border-top-color:var(--rosa);border-radius:50%;animation:sp 0.7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  textarea{font-family:inherit}
  .itembox{background:var(--bg);border-radius:12px;padding:12px;margin-bottom:12px}
  /* ---- reportes de cobro (se convierten en imagen) ---- */
  .rep-card{width:520px;background:#fff;padding:14px 14px 16px;border:1px solid #e3e7ec;color:#232323;font-family:Arial,Helvetica,sans-serif}
  .rc-head{color:#C00000;font-weight:bold;font-size:18px;text-align:center;margin:2px 0 10px;line-height:1.15}
  .rc-band{display:flex;gap:12px;align-items:center;margin-bottom:14px}
  .rc-logo{width:66px;height:66px;flex:0 0 66px;border-radius:6px;background:#16233a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
  .rc-pick{flex:1;text-align:center;color:#5F5F5F;font-size:14.5px;line-height:1.32}
  .rc-namerow{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
  .rc-name{font-weight:bold;font-size:28px;color:#232323;flex:1;line-height:1.05}
  .rc-badge{font-weight:bold;font-size:14.5px;color:#fff;background:#E89640;padding:6px 11px;white-space:nowrap;display:flex;align-items:center}
  .rc-amt{font-weight:bold;font-size:14.5px;color:#232323;background:#FFD600;padding:6px 11px;white-space:nowrap;display:flex;align-items:center}
  table.rc-tbl{width:100%;border-collapse:collapse;font-size:16px;table-layout:fixed}
  table.rc-tbl th{background:#F4CBA0;color:#232323;border:1px solid #CBCBCB;padding:6px;text-align:center;font-size:14px}
  table.rc-tbl th.rc-thdesc{text-align:left}
  table.rc-tbl td{border:1px solid #CBCBCB;padding:7px;color:#232323;vertical-align:middle;height:34px}
  table.rc-tbl td.rc-qty,table.rc-tbl td.rc-cst,table.rc-tbl td.rc-sub{text-align:center}
  table.rc-tbl td.rc-desc{text-align:left;line-height:1.28;word-wrap:break-word;overflow-wrap:break-word}
  col.rc-cqty{width:56px}col.rc-ccst{width:66px}col.rc-csub{width:78px}
  .rc-foot{color:#5F5F5F;font-size:14.5px;text-align:center;line-height:1.34;margin:14px 4px 10px}
  .rc-foot u{text-decoration:underline}
  .rc-bank{text-align:center;color:#2E59A8;line-height:1.3}
  .rc-bank .rc-bt{font-weight:bold;font-size:17px;text-decoration:underline}
  .rc-bank .rc-bn{font-weight:bold;font-size:19px;margin-top:3px}
  .rc-bank .rc-ba{font-weight:bold;font-size:15px;margin-top:2px}
  /* packing labels */
  .plabel-prev,.plabel{color:#111;font-family:Arial,Helvetica,sans-serif}
  .phdr{background:#111;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:6px 12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pbrand{font-weight:800;font-size:14px;letter-spacing:.02em}
  .pdate{font-size:12px;font-weight:600}
  .pname{font-weight:800;font-size:22px;margin:8px 12px 0;line-height:1.05}
  .pcount{font-size:12px;color:#2E59A8;font-weight:600;margin:2px 12px 8px}
  .pitems{margin:0 12px}
  .pitem{font-size:14px;padding:5px 0;border-bottom:1px dashed #bbb}
  .pcb{color:#111}
  .pqty{color:#111;font-weight:800}
  .pdesc{color:#2E59A8}
  .pfoot{display:flex;justify-content:space-between;align-items:center;margin:8px 12px 12px;font-size:11px}
  .pfl{color:#2E59A8}
  .pfr{color:#111;font-weight:800}
  #print-root{display:none}
  /* etiquetas de impresion (mismo estilo en pantalla al medir y al imprimir) */
  .plabel{border:1.5px solid #000;break-inside:avoid;page-break-inside:avoid;overflow:hidden;width:94mm;box-sizing:border-box;background:#fff}
  .plabel .pname{font-size:16pt}
  .plabel .pcount{font-size:8pt}
  .plabel .pitem{font-size:10.5pt;padding:1mm 0}
  .plabel .phdr{padding:2mm 3mm}
  .plabel .pbrand{font-size:11pt}
  .plabel .pdate{font-size:9pt}
  .plabel .pfoot{font-size:8pt;margin:3mm}
  .ppage{display:flex;gap:6mm;align-items:flex-start;break-after:page;page-break-after:always}
  .ppage:last-child{break-after:auto;page-break-after:auto}
  .pcol{display:flex;flex-direction:column;gap:4mm;width:94mm}

  /* ===== Bancos ===== */
  .bk-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:14px}
  .bk-read,.bk-k{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:4px}
  .bk-read{background:#111;color:#fff}.bk-read .bk-lbl{color:var(--mint)}.bk-read b{font-size:16px}.bk-read .pill{margin-top:8px;height:42px}
  .bk-k{border:1px solid var(--line)}.bk-k b{font-size:26px;font-weight:800}
  .bk-pink{background:var(--rosaSoft);color:var(--rosaDark);border-color:transparent}
  .bk-lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.bk-note{font-size:12px;opacity:.8}
  .bk-sel{width:auto;height:38px;border-radius:999px;padding:0 12px;font-size:13px;font-weight:700}
  .bk-xl{height:38px;font-size:13px;padding:0 16px}
  .bk-list{display:flex;flex-direction:column;gap:10px;padding-bottom:20px}
  .bk-row{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px 16px;background:#fff}
  .bk-amt{min-width:120px;display:flex;flex-direction:column}.bk-amt b{font-size:18px;font-weight:800}.bk-amt span{font-size:12px;color:var(--inkSoft)}
  .bk-info{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:2px}.bk-info b{font-size:14px}.bk-info span{font-size:12px;color:var(--inkSoft)}
  .bk-clave{font-family:ui-monospace,Menlo,monospace;font-size:11px!important}
  .bk-right{display:flex;flex-direction:column;gap:6px;align-items:flex-end;margin-left:auto}
  .bk-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.bk-ped{font-size:12px;color:var(--inkSoft);text-align:right}
  @media(max-width:860px){.bk-kpis{grid-template-columns:1fr 1fr}.bk-read{grid-column:1/-1}.bk-k b{font-size:20px}.bk-right{align-items:flex-start;margin-left:0;width:100%}.bk-btns{justify-content:flex-start;width:100%}.bk-btns .pill{flex:1;white-space:nowrap}}

  /* ===== Reportes ===== */
  .rp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding-bottom:20px}
  .rp-card{border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px}
  .rp-card h3{margin:2px 0 0;font-size:17px}.rp-card p{margin:0;font-size:13px;color:var(--inkSoft);line-height:1.5;flex:1}
  .rp-btns{display:flex;gap:8px;margin-top:6px}.rp-btns .pill{flex:1;height:40px;font-size:13px;padding:0 10px}
  .rp-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}.rp-head h2{margin:0;font-size:20px}
  .rp-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
  .rp-s{background:var(--bg);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}.rp-s span{font-size:12px;color:var(--inkSoft);font-weight:700}.rp-s b{font-size:20px}
  .rp-tblw{overflow-x:auto;border:1px solid var(--line);border-radius:16px;margin-bottom:24px}
  .rp-tbl th,.rp-tbl td{padding:10px 12px}.rp-tbl .num{text-align:right}.rp-tbl td.b{font-weight:700}.rp-tbl tbody tr:hover{background:#FAFBFB}
  .rp-print{page:rp;font-family:Arial,Helvetica,sans-serif;color:#111}
  @page rp{size:letter landscape;margin:10mm}
  .rp-ph{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:8px}
  .rp-ph img{width:40px;height:40px;border-radius:8px}.rp-pt{font-size:18pt;font-weight:800}.rp-ps{font-size:9pt;color:#555}
  .rp-psum{display:flex;flex-wrap:wrap;gap:6mm;margin:4mm 0}.rp-psum div{display:flex;flex-direction:column}.rp-psum span{font-size:8pt;color:#555}.rp-psum b{font-size:12pt}
  .rp-print table{width:100%;border-collapse:collapse;font-size:8.5pt}
  .rp-print th{background:#111;color:#fff;text-align:left;padding:2mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .rp-print td{padding:1.6mm 2mm;border-bottom:1px solid #ddd}.rp-print .num{text-align:right}
  .rp-print tr{break-inside:avoid}.rp-pf{margin-top:4mm;font-size:8pt;color:#777;text-align:right}

  /* ===== Dashboards ===== */
  .db-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
  .db-tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:999px;flex-wrap:wrap}
  .db-tab{height:36px;padding:0 16px;border-radius:999px;background:transparent;color:#1E2725;font-weight:700;font-size:13px}.db-tab.on{background:#111;color:#fff}
  .db-sub{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}.db-chips{display:flex;gap:6px;flex-wrap:wrap}.db-chips .tk-tab{height:34px;font-size:12px}
  .db-clear{height:34px;padding:0 12px;border-radius:999px;background:var(--rosaSoft);color:var(--rosaDark);font-weight:800;font-size:12px}
  .db-hint{font-size:12px;color:var(--inkSoft);margin-left:auto}
  .db-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:14px}
  .db-k{border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;color:#111;background:#fff;text-align:left}
  .db-k>span{font-size:12px;font-weight:700;opacity:.8}.db-k svg{width:100%;height:28px;margin-top:4px}
  .db-kv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.db-kv b{font-size:24px;letter-spacing:-.02em}
  .db-kv em{font-style:normal;font-size:12px;font-weight:800}.db-kv em.up{color:#0B5E45}.db-kv em.down{color:var(--rosaDark)}
  .db-dark{background:#111;color:#fff;border-color:#111}.db-dark .db-kv em.up{color:var(--mint)}.db-dark .db-kv em.down{color:#F59BC3}.db-dark svg{color:var(--mint)}
  .db-pink{background:var(--rosaSoft);color:var(--rosaDark);border-color:transparent}.db-mint{background:color-mix(in srgb,var(--mint) 18%,white);border-color:transparent}
  .db-seg{cursor:pointer;border-width:3px}.db-seg.on{border-color:var(--rosa)}.db-sd{font-style:normal;font-size:12px;opacity:.85}
  .db-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;padding-bottom:24px}
  .db-card{border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
  .db-card h2{margin:0;font-size:16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}.db-card h2 small{font-size:12px;font-weight:500;color:var(--inkSoft);display:flex;gap:10px;align-items:center}
  .db-wide{grid-column:span 2}.db-wide2{grid-column:span 2}
  .db-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}.db-ln{display:inline-block;width:14px;height:3px;background:#111;margin-right:4px;vertical-align:middle}
  .db-combo{position:relative;height:250px}
  .db-bars{position:absolute;inset:0 0 0 0;display:flex;align-items:flex-end;gap:6px;padding-bottom:22px}
  .db-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;min-width:0}
  .db-col button,.db-col i{width:56%;border-radius:8px 8px 3px 3px;padding:0;display:block}
  .db-v{font-size:11px;font-weight:700;margin-bottom:4px}.db-l{position:absolute;bottom:-20px;font-size:11px;color:var(--inkSoft);white-space:nowrap}
  .db-line{position:absolute;left:0;top:0;width:100%;height:228px;pointer-events:none}
  .db-bars2{position:relative;height:190px}
  .db-donutw{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
  .db-donut{width:180px;height:180px;border-radius:50%;position:relative;flex:0 0 auto}
  .db-donut>div{position:absolute;inset:32px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}.db-donut span{font-size:12px;color:var(--inkSoft)}.db-donut b{font-size:18px}
  .db-legend{flex:1;min-width:150px;display:flex;flex-direction:column;gap:4px}
  .db-legend button{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 8px;border-radius:10px;background:transparent;text-align:left;color:#111}.db-legend button span{flex:1}.db-legend button.on{background:var(--rosaSoft)}
  .db-legh{flex-direction:row;flex-wrap:wrap}.db-legh button{padding:4px 8px}
  .db-hbar{display:grid;grid-template-columns:minmax(0,1.3fr) 2fr 40px;gap:10px;align-items:center;font-size:13px}.db-hbar>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .db-hbar>div,.db-track{height:12px;border-radius:999px;background:#F0F3F2;overflow:hidden}.db-hbar i,.db-track i{display:block;height:100%;border-radius:999px}.db-hbar b{text-align:right}
  .db-stack{display:flex;height:26px;border-radius:10px;overflow:hidden;background:#F0F3F2}.db-stack i{display:block;height:100%}
  .db-leg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}.db-leg2>div{display:flex;align-items:center;gap:6px;font-size:13px}.db-leg2 span{flex:1}
  .db-tot{margin-left:auto;color:var(--rosaDark);font-size:18px}
  .db-link{align-self:flex-start;background:transparent;color:var(--rosaDark);font-weight:800;font-size:13px;padding:0}
  .db-fb{display:flex;flex-direction:column;gap:4px}.db-fb>div:first-child{display:flex;justify-content:space-between;font-size:13px}
  .db-empty{color:var(--inkSoft);font-size:13px;padding:10px 0}.db-note{font-size:12px;color:var(--inkSoft)}
  .db-hero{background:#111;color:#fff;border-color:#111;grid-column:span 2}.db-eyebrow{font-size:12px;font-weight:800;color:var(--mint);letter-spacing:.06em;text-transform:uppercase}
  .db-big{font-size:42px!important}.db-hero .db-note{color:#C9D3CF}.db-hero .db-kv em.up{color:var(--mint)}.db-hero .db-kv em.down{color:#F59BC3}
  .db-area{width:100%;height:140px}.db-xl{display:flex;justify-content:space-between;font-size:11px;color:#C9D3CF}
  .db-mix{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center;font-size:12px}.db-mix b.on{color:var(--rosaDark)}.db-mix>div{display:flex;height:18px;border-radius:6px;overflow:hidden;background:#F0F3F2}.db-mix i{display:block;height:100%}
  .db-heat{display:grid;grid-template-columns:40px repeat(6,minmax(0,1fr));gap:4px;font-size:11px}.db-heat i{height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700}
  .db-hw{text-align:center;color:var(--inkSoft)}.db-hd{font-weight:700;color:var(--inkSoft);display:flex;align-items:center}
  .db-deud{display:grid;grid-template-columns:minmax(110px,1fr) 2fr 90px 64px auto;gap:12px;align-items:center;font-size:13px;padding:6px 0;border-top:1px solid #F0F3F2}
  .db-deud .db-r{text-align:right}.db-deud span{font-size:12px;font-weight:700;color:var(--inkSoft)}.db-deud span.late{color:var(--rosaDark)}
  .db-mtx{position:relative;height:360px;border-left:1.5px solid #111;border-bottom:1.5px solid #111;margin:6px 4px 6px 4px}
  .db-mtx>span{position:absolute;font-size:12px;font-weight:800}.db-mtx .q1{right:8px;top:6px;color:#0B5E45}.db-mtx .q2{left:8px;top:6px;color:#3F4A46}.db-mtx .q3{right:8px;bottom:6px;color:#3F4A46}.db-mtx .q4{left:8px;bottom:6px;color:var(--rosaDark)}
  .db-vx{position:absolute;top:0;bottom:0;width:1px;background:#DDE4E1}.db-vy{position:absolute;left:0;right:0;height:1px;background:#DDE4E1}
  .db-mtx button{position:absolute;border-radius:50%;transform:translate(-50%,50%);opacity:.75;border:2px solid #fff;padding:0}.db-mtx button.on{opacity:1;border:3px solid #111;z-index:2}
  .db-psel{background:color-mix(in srgb,var(--mint) 12%,white);border-color:transparent}
  .db-mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.db-mini>div{background:#fff;border-radius:12px;padding:10px}.db-mini span{font-size:11px;color:var(--inkSoft);display:block}.db-mini b{font-size:18px}
  .db-funnel{display:flex;flex-direction:column;gap:6px;align-items:center}.db-funnel>div{display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 18px;border-radius:12px;box-sizing:border-box;font-size:14px}
  .db-todo{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:14px;background:var(--bg);font-size:14px;text-align:left;color:#111}.db-todo span{flex:1}.db-todo b{font-size:18px}.db-todo em{font-style:normal;color:var(--rosaDark);font-weight:800}
  @media(max-width:860px){.db-wide,.db-wide2,.db-hero{grid-column:auto}.db-grid{grid-template-columns:1fr}.db-hint{display:none}.db-deud{grid-template-columns:1fr auto;}.db-deud .db-track{grid-column:1/-1;order:5}.db-mtx{height:300px}}

  /* ===== Pedidos y Cobranza ===== */
  .pd-k{margin-bottom:10px}
  .pd-agenda{font-size:13px;color:var(--inkSoft);background:var(--bg);border-radius:12px;padding:8px 12px;margin-bottom:12px}
  .pd-fol{font-size:11px;color:var(--grey);font-weight:600;margin-left:4px}
  .pd-amt{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}.pd-amt b{font-size:14px}.pd-amt span{font-size:11px;color:var(--rosaDark);font-weight:700}

  .tk-btns{display:flex;flex-wrap:wrap;gap:8px}.tk-btns .pill{flex:1 1 130px;font-size:13px}.tk-btns .tk-main{flex:2 1 220px;font-size:14px}
  .tk-rem{background:var(--rosaSoft);color:var(--rosaDark);width:100%;font-size:13px}
  .tk-msg{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5}.tk-msg span{font-weight:700;color:var(--inkSoft);font-size:12px}
  .tk-meta{font-size:12px;color:var(--inkSoft)}.tk-meta a{color:var(--rosaDark)}
  .tk-prev{overflow-x:auto}
  .tk-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:200;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  @media(max-width:860px){.tk-list{max-width:none;max-height:46vh}.tk-acts .pill{flex:1 1 auto}.tk-prev .rep-card{zoom:.66}}

  /* ===== Productos 360 ===== */
  .p3-head{display:flex;gap:14px;align-items:flex-start}
  .p3-ph{width:64px;height:64px;border-radius:16px;background:var(--rosaSoft);color:var(--rosaDark);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;flex:0 0 auto}
  .p3-cat{font-size:12px;font-weight:800;color:var(--rosaDark)}
  .p3-name{font-size:20px;font-weight:800;line-height:1.25;margin:2px 0 4px}
  .p3-price{font-size:14px}.p3-price a{color:var(--rosaDark);font-size:13px}
  .p3-edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end;background:var(--bg);border-radius:12px;padding:12px}
  .p3-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  .p3-k{background:var(--bg);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}.p3-k span{font-size:12px;opacity:.85}.p3-k b{font-size:22px;font-weight:800}
  .p3-dark{background:#111;color:#fff}.p3-mint{background:var(--mint);color:#111}.p3-pink{background:var(--rosaSoft);color:var(--rosaDark)}
  .p3-sub{font-size:14px;font-weight:800;margin-bottom:8px}
  .p3-chart{display:flex;align-items:flex-end;gap:8px;height:120px}
  .p3-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
  .p3-bar{width:100%;max-width:44px;border-radius:8px 8px 3px 3px}.p3-v{font-size:11px;font-weight:700}.p3-l{font-size:10px;color:var(--inkSoft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .p3-tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
  .p3-tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--inkSoft);padding:8px;border-bottom:1px solid var(--line)}
  .p3-tbl td{padding:9px 8px;border-bottom:1px solid #F0F3F2;white-space:nowrap}

  /* ===== Packing ===== */
  .pk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;padding-bottom:20px}
  .pk-card{border:1.5px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff}
  .pk-card.done{border-color:color-mix(in srgb,var(--mint) 55%,white)}
  .pk-hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.pk-hd b{font-size:16px;display:block}.pk-hd span{font-size:12px;color:var(--inkSoft)}
  .pk-items{display:flex;flex-direction:column;gap:2px}
  .pk-it{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:5px 2px;border-bottom:1px dashed #E5EBE8;cursor:pointer}
  .pk-it input{width:16px;height:16px;margin:1px 0 0;accent-color:var(--mint);flex:0 0 auto}
  .pk-it.on span{color:var(--inkSoft)}.pk-q{font-weight:800;color:#111!important}
  .pk-ft{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;margin-top:auto}
  .pk-card{position:relative}.pk-card.sel{border-color:var(--rosa);box-shadow:0 0 0 2px var(--rosaSoft)}
  .pk-sel{align-self:flex-start;display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--inkSoft);cursor:pointer;margin-bottom:-4px}
  .pk-sel input,.pk-selall input{width:16px;height:16px;margin:0;accent-color:var(--rosa)}
  .pk-selbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:-4px 0 14px;padding:10px 14px;border-radius:14px;background:var(--bg);font-size:13px}
  .pk-selbar.on{background:var(--rosaSoft)}
  .pk-selall{display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer}
  .pk-seln{flex:1;color:var(--inkSoft);font-weight:700}
  .pk-btns{display:flex;gap:6px;align-items:center}.pk-b{height:36px;padding:0 12px;font-size:12px}.pk-pr{width:36px;height:36px;font-size:15px}
  @media print{.side,.topbar,.sidebg{display:none!important}body{zoom:1}}

function mxn(n){n=Number(n)||0;return '$'+n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function fmtDate(iso){if(!iso)return '';var p=String(iso).split('-');if(p.length<3)return String(iso);return p[2]+'/'+p[1]+'/'+p[0].slice(2);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function itemImp(it){return Number(it.importe)||(Number(it.cantidad)||0)*(Number(it.precioUnit)||0);}
function pedTotal(p){return (p.items||[]).reduce(function(s,it){return s+itemImp(it);},0);}
function pedPagado(p){return STATE.pagos.filter(function(g){return g.pedidoId===p.id;}).reduce(function(s,g){return s+(Number(g.monto)||0);},0);}
function pedVista(p){var t=pedTotal(p),pg=pedPagado(p),sal=t-pg;var e='Pendiente';if(p.cancelado)e='Cancelado';else if(sal<=0.001)e='Pagado';else if(pg>0)e='Parcial';return{total:t,pagado:pg,saldo:sal,estatus:e};}
function estStyle(e){return {Pendiente:['var(--rosaSoft)','var(--rosaDark)'],Parcial:['var(--amberSoft)','var(--amber)'],Pagado:['var(--greenSoft)','var(--green)'],Cancelado:['var(--greySoft)','var(--grey)']}[e];}
function byId(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null;}
function clienteTel(nombre){var n=(nombre||'').trim().toLowerCase();for(var i=0;i<STATE.clientes.length;i++)if(STATE.clientes[i].nombre.toLowerCase()===n)return STATE.clientes[i].telefono;return '';}
function prodPrecio(nombre){var n=(nombre||'').trim().toLowerCase();for(var i=0;i<STATE.productos.length;i++)if(STATE.productos[i].nombre.toLowerCase()===n)return STATE.productos[i].precio;return null;}

function hideLoading(){document.getElementById('loading').classList.add('hidden');}

function nextFolio(){var max=0;STATE.pedidos.forEach(function(p){var m=String(p.folio||'').match(/(\d+)/);if(m){var n=parseInt(m[1],10);if(n>max)max=n;}});return 'P-'+('000'+(max+1)).slice(-4);}

function findOrCreateCliente(nombre,telefono,force){
  nombre=(nombre||'').trim(); if(!nombre) return Promise.resolve(null);
  var key=nombre.toLowerCase();
  if(CLI_ID_BY_NAME[key]){
    var id=CLI_ID_BY_NAME[key];
    if(telefono){var cur=(CLI_BY_ID[id]&&CLI_BY_ID[id].telefono)||'';if(force||!cur){return sb.from('clientes').update({telefono:telefono}).eq('id',id).then(function(){if(CLI_BY_ID[id])CLI_BY_ID[id].telefono=telefono;return id;});}}

function buildReport(activos){
  var map={},order=[];
  activos.forEach(function(p){
    var v=pedVista(p);
    if(!map[p.cliente]){map[p.cliente]={cliente:p.cliente,telefono:p.telefono||'',peds:[],totalSaldo:0,totalPagado:0,pendientes:0};order.push(p.cliente);}
    var m=map[p.cliente];
    m.peds.push({id:p.id,folio:p.folio,periodo:p.periodo,total:v.total,pagado:v.pagado,saldo:v.saldo,estatus:v.estatus});
    m.totalSaldo+=Math.max(0,v.saldo);m.totalPagado+=v.pagado;if(v.saldo>0.001)m.pendientes+=1;if(p.telefono)m.telefono=p.telefono;
  });
  var out=order.map(function(n){var m=map[n];if(!m.telefono)m.telefono=clienteTel(n);m.peds.sort(function(a,b){return (a.periodo||'').localeCompare(b.periodo||'');});return m;});
  out.sort(function(a,b){return b.totalSaldo-a.totalSaldo;});
  return out;
}
var CB_TAB='saldo', CB_SEL='';
function cbDias(c){var f='9999';STATE.pedidos.forEach(function(p){if(p.cancelado||p.cliente!==c.cliente)return;if(pedVista(p).saldo>0.001&&(p.fecha||'9999')<f)f=p.fecha||'9999';});return f==='9999'?null:rpDias(f);}

function cbPick(n){CB_SEL=n;document.getElementById('cb-det').innerHTML=cbDetail(n);Array.prototype.forEach.call(document.querySelectorAll('#cli-list .tk-item'),function(b){b.classList.toggle('on',b.getAttribute('data-id')===n);});if(window.innerWidth<=860){var d=document.getElementById('cb-det');if(d)d.scrollIntoView({behavior:'smooth',block:'start'});}}

/* --- pago (multiple) --- */
var CLI_OPTS=[];
function pedidosConSaldo(){return STATE.pedidos.map(function(p){return {p:p,v:pedVista(p)};}).filter(function(o){return o.v.estatus==='Pendiente'||o.v.estatus==='Parcial';}).map(function(o){return {id:o.p.id,folio:o.p.folio,periodo:o.p.periodo,cliente:o.p.cliente,saldo:o.v.saldo};});}
function pendingByCli(cli){return pedidosConSaldo().filter(function(x){return x.cliente===cli;});}
function pagoClientes(){var s={},out=[];pedidosConSaldo().forEach(function(x){if(!s[x.cliente]){s[x.cliente]=1;out.push(x.cliente);}});out.sort(function(a,b){return a.localeCompare(b,'es');});return out;}
function byIdArr(a,id){for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function openPago(pedidoId){
  var list=pedidosConSaldo();
  if(!list.length){openModal('Registrar pago','<div style="text-align:center;color:var(--inkSoft);padding:20px">No hay pedidos con saldo pendiente.</div>');return;}
  CLI_OPTS=pagoClientes();
  var pre=pedidoId?byIdArr(list,pedidoId):null;
  if(pre){PAGO_CLI=pre.cliente;PAGO_ROWS=[{pedidoId:pre.id,monto:String(pre.saldo),metodo:'Efectivo'}];}
  else{PAGO_CLI='';PAGO_ROWS=[];}
  openModal('Registrar pago',pagoBody());
}
function pagoBtnLabel(){return 'Registrar '+(PAGO_ROWS.length>1?PAGO_ROWS.length+' pagos':'pago');}
function pagoBody(){
  var h='';
  h+='<div class="fld"><label class="lbl">Cliente</label><div style="position:relative"><input id="pg-cli" autocomplete="off" value="'+esc(PAGO_CLI)+'" oninput="pgCliInput()" onfocus="pgCliShow()" onblur="setTimeout(pgCliHide,180)" placeholder="Busca o elige el cliente"><div id="pg-cli-dd" style="display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:40;background:#fff;border:1px solid var(--line);border-radius:12px;max-height:210px;overflow-y:auto;box-shadow:0 10px 30px rgba(26,22,38,.14)"></div></div></div>';
  h+='<div class="fld"><label class="lbl">Fecha</label><input id="pg-fecha" type="date" value="'+todayISO()+'"></div>';
  h+='<label class="lbl">Pagos</label><div id="pago-rows">'+pagoRowsHTML()+'</div>';
  h+='<button class="btn btnG" style="margin-top:8px" onclick="submitPagos()">'+pagoBtnLabel()+'</button>';

}

  q=(q||'').trim().toLowerCase();

  var html='';

  if(!html)html='<div style="padding:9px 12px;color:var(--inkSoft);font-size:13px">Sin coincidencias</div>';

function pgCliShow(){var el=document.getElementById('pg-cli');if(el)el.select();renderCliDD('');var dd=document.getElementById('pg-cli-dd');if(dd)dd.style.display='block';}
function pgCliInput(){renderCliDD(document.getElementById('pg-cli').value);var dd=document.getElementById('pg-cli-dd');if(dd)dd.style.display='block';}
function pgCliHide(){var dd=document.getElementById('pg-cli-dd');if(dd)dd.style.display='none';}
function pgCliPick(i){var name=CLI_OPTS[i];if(name==null)return;PAGO_CLI=name;var el=document.getElementById('pg-cli');if(el)el.value=name;pgCliHide();var f=pendingByCli(name)[0];PAGO_ROWS=f?[{pedidoId:f.id,monto:String(f.saldo),metodo:'Efectivo'}]:[];refreshRows();}
function pagoRowsHTML(){
  if(!PAGO_CLI)return '<div style="color:var(--inkSoft);font-size:13px;padding:8px 0">Elige un cliente arriba para registrar su pago.</div>';

    h+='<div class="itembox">';

    h+='<select onchange="pagoRowPed('+i+',this.value)" style="margin-bottom:8px">'+peds.map(function(x){return '<option value="'+x.id+'"'+(x.id===r.pedidoId?' selected':'')+'>'+esc(x.folio)+' &middot; '+esc(x.periodo)+' &middot; saldo '+mxn(x.saldo)+'</option>';}).join('')+'</select>';
    h+='<div class="row2"><div><span style="font-size:11px;color:var(--inkSoft)">Monto</span><input id="pgm-'+i+'" inputmode="decimal" value="'+esc(r.monto)+'" oninput="pagoRowInput('+i+',\'monto\',this.value)"></div>';
    h+='<div><span style="font-size:11px;color:var(--inkSoft)">Metodo</span><select onchange="pagoRowInput('+i+',\'metodo\',this.value)">'+['Efectivo','Transferencia','Tarjeta','Otro'].map(function(m){return '<option'+(m===r.metodo?' selected':'')+'>'+m+'</option>';}).join('')+'</select></div></div>';
    h+='</div>';
  });
  h+='<button onclick="pagoAddRow()" style="width:100%;padding:8px;border-radius:12px;border:1px dashed var(--line);color:var(--green);background:none;font-weight:500">+ Agregar otro pago</button>';

}
function refreshRows(){var box=document.getElementById('pago-rows');if(box)box.innerHTML=pagoRowsHTML();var b=document.querySelector('#modal-root .btnG');if(b)b.textContent=pagoBtnLabel();}
function pagoAddRow(){var f=pendingByCli(PAGO_CLI)[0];if(f)PAGO_ROWS.push({pedidoId:f.id,monto:String(f.saldo),metodo:'Efectivo'});refreshRows();}
function pagoRmRow(i){PAGO_ROWS.splice(i,1);refreshRows();}
function pagoRowPed(i,val){PAGO_ROWS[i].pedidoId=val;var sel=byIdArr(pendingByCli(PAGO_CLI),val);var el=document.getElementById('pgm-'+i);if(sel&&el){el.value=String(sel.saldo);PAGO_ROWS[i].monto=String(sel.saldo);}}

function submitPagos(){
  if(!PAGO_CLI){alert('Elige un cliente.');return;}
  var fecha=document.getElementById('pg-fecha').value||todayISO();
  var pagos=PAGO_ROWS.filter(function(r){return r.pedidoId&&Number(r.monto)>0;}).map(function(r){return {pedidoId:r.pedidoId,cliente:PAGO_CLI,monto:Number(r.monto),metodo:r.metodo,fecha:fecha,by:ME};});

/* ---------- PRODUCTOS 360 (catalogo + historial de quien y cuando) ---------- */
var P3_SEL='', P3_Q='', P3_CAT='Todas', P3_SORT='pedidos', P3_LIMIT=150, P3_EDIT=false;
function p3Key(n){return String(n||'').trim().toLowerCase().replace(/\s+/g,' ');}
function p3PerOrder(){var mn={};STATE.pedidos.forEach(function(p){if(!p.periodo)return;var f=p.fecha||'9999';if(!mn[p.periodo]||f<mn[p.periodo])mn[p.periodo]=f;});return Object.keys(mn).sort(function(a,b){return mn[a]<mn[b]?-1:mn[a]>mn[b]?1:0;});}
function p3Agg(){
  var cat={};STATE.productos.forEach(function(p){cat[p3Key(p.nombre)]=p;});
  var m={},order=[];
  STATE.pedidos.forEach(function(p){if(p.cancelado)return;var v=pedVista(p);
    (p.items||[]).forEach(function(it){var k=p3Key(it.concepto);if(!k)return;
      if(!m[k]){var c=cat[k]||null;m[k]={key:k,nombre:(c&&c.nombre)||String(it.concepto).trim(),prod:c,categoria:(c&&c.categoria)||'',uds:0,venta:0,peds:0,cli:{},hist:[],perU:{},ult:'',ultPrecio:null};order.push(k);}
      var x=m[k],q=Number(it.cantidad)||0;x.uds+=q;x.venta+=itemImp(it);x.peds++;x.cli[p.cliente]=(x.cli[p.cliente]||0)+1;
      x.perU[p.periodo]=(x.perU[p.periodo]||0)+q;
      x.hist.push({cliente:p.cliente,fecha:p.fecha,periodo:p.periodo,folio:p.folio,cant:q,precio:it.precioUnit,importe:itemImp(it),estatus:v.estatus});
      if((p.fecha||'')>=x.ult){x.ult=p.fecha||'';x.ultPrecio=it.precioUnit;}
    });
  });
  // productos del catalogo que aun no se han pedido
  STATE.productos.forEach(function(p){var k=p3Key(p.nombre);if(!k||m[k])return;m[k]={key:k,nombre:p.nombre,prod:p,categoria:p.categoria||'',uds:0,venta:0,peds:0,cli:{},hist:[],perU:{},ult:'',ultPrecio:p.precio};order.push(k);});
  return order.map(function(k){var x=m[k];var nc=Object.keys(x.cli).length,rep=Object.keys(x.cli).filter(function(c){return x.cli[c]>1;}).length;
    x.nCli=nc;x.recompra=nc?Math.round(rep/nc*100):0;x.hist.sort(function(a,b){return (b.fecha||'').localeCompare(a.fecha||'');});
    x.precio=(x.prod&&x.prod.precio!=null)?x.prod.precio:x.ultPrecio;return x;});
}
function p3Filtered(all){
  var q=p3Key(P3_Q);
  var l=all.filter(function(x){return (P3_CAT==='Todas'||(P3_CAT==='Sin categoria'?!x.categoria:x.categoria===P3_CAT))&&(!q||x.key.indexOf(q)>=0);});
  l.sort(function(a,b){if(P3_SORT==='az')return a.nombre.localeCompare(b.nombre,'es');if(P3_SORT==='recientes')return (b.ult||'').localeCompare(a.ult||'');if(P3_SORT==='venta')return b.venta-a.venta;return b.peds-a.peds||a.nombre.localeCompare(b.nombre,'es');});
  return l;
}
function renderP360(){
  var all=p3Agg();window._P3=all;
  var cats={};all.forEach(function(x){if(x.categoria)cats[x.categoria]=1;});
  var catList=['Todas'].concat(Object.keys(cats).sort(function(a,b){return a.localeCompare(b,'es');}));if(all.some(function(x){return !x.categoria;}))catList.push('Sin categoria');
  if(catList.indexOf(P3_CAT)<0)P3_CAT='Todas';
  var list=p3Filtered(all);
  if(!list.some(function(x){return x.key===P3_SEL;}))P3_SEL=list.length?list[0].key:'';
  var conPed=all.filter(function(x){return x.peds>0;}).length;
  var h='<div class="tk-top"><div class="tk-toprow"><div class="tk-prog" style="padding:0"><div class="tk-progtxt"><b>'+all.length+' productos en catalogo</b><span>'+conPed+' con pedidos</span></div><div style="font-size:13px;color:var(--inkSoft)">Cada producto que capturas en un pedido se agrega solo. Aqui ves todo su historial, sin importar el periodo.</div></div>';
  h+='<div class="tk-acts"><select onchange="p3Sort(this.value)" style="height:42px;width:auto;border-radius:999px;padding:0 14px;font-size:13px;font-weight:700">'+[['pedidos','Mas pedidos'],['venta','Mayor venta'],['recientes','Mas recientes'],['az','A-Z']].map(function(o){return '<option value="'+o[0]+'"'+(P3_SORT===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>';
  h+='<button class="pill pillR" onclick="p3ExcelCatalogo()">Exportar Excel</button></div></div></div>';
  h+='<div class="tk-tabs">'+catList.map(function(c){return '<button class="tk-tab'+(P3_CAT===c?' on':'')+'" onclick="p3Cat(\''+esc(c).replace(/'/g,"\\'")+'\')">'+esc(c)+'</button>';}).join('')+'<input id="p3-q" class="tk-q" placeholder="Buscar producto..." value="'+esc(P3_Q)+'" oninput="p3Search()"></div>';
  if(!all.length)return h+emptyBox('Sin productos','Se agregan solos al capturar pedidos.');
  h+='<div class="tk-grid"><div class="tk-list" id="p3-list">'+p3ListHTML(list)+'</div>';
  var sel=null;for(var i=0;i<all.length;i++)if(all[i].key===P3_SEL){sel=all[i];break;}
  h+='<div class="tk-det" id="p3-det">'+(sel?p3DetHTML(sel):'')+'</div></div>';

function p3ListHTML(list){
  if(!list.length)return '<div style="color:var(--inkSoft);padding:20px 4px">Sin resultados.</div>';
  var h=list.slice(0,P3_LIMIT).map(function(x){
    return '<button class="tk-item'+(x.key===P3_SEL?' on':'')+'" data-id="'+esc(x.key)+'" onclick="p3Pick(this.getAttribute(\'data-id\'))"><div class="tk-itxt"><b>'+esc(x.nombre)+'</b><div class="tk-chips">'+
      (x.categoria?tkChip(esc(x.categoria),'#EEF1F0','#3F4A46'):'')+(x.peds?tkChip(x.peds+' pedido'+(x.peds!==1?'s':''),'color-mix(in srgb,var(--mint) 22%,white)','#0B5E45'):tkChip('Sin pedidos','#EEF1F0','#6B7772'))+
      (x.ult?tkChip('Ult. '+fmtDate(x.ult),'#F5F7F6','#3F4A46'):'')+'</div></div><span class="tk-itot">'+(x.precio!=null?mxn(x.precio):'')+'</span></button>';
  }).join('');
  if(list.length>P3_LIMIT)h+='<button class="pill pillO" style="width:100%" onclick="P3_LIMIT+=150;p3Search()">Ver mas ('+(list.length-P3_LIMIT)+')</button>';
  return h;
}

  h+='</div>';

  if(!x.hist.length)h+='<div style="color:var(--inkSoft);font-size:13px">Aun no se ha pedido.</div>';
  else{h+='<div style="overflow-x:auto"><table class="p3-tbl"><thead><tr><th>Cliente</th><th>Fecha</th><th>Periodo</th><th>Folio</th><th>Cant.</th><th>Precio</th><th>Estatus</th></tr></thead><tbody>';
    x.hist.forEach(function(r){var st=estStyle(r.estatus)||['#EEE','#333'];h+='<tr><td><b>'+esc(r.cliente)+'</b></td><td>'+fmtDate(r.fecha)+'</td><td>'+esc(r.periodo)+'</td><td>'+esc(r.folio)+'</td><td>'+r.cant+'</td><td>'+(r.precio!=null?mxn(r.precio):'')+'</td><td><span class="tk-chip" style="background:'+st[0]+';color:'+st[1]+'">'+esc(r.estatus)+'</span></td></tr>';});
    h+='</tbody></table></div>';}
  h+='</div>';
  return h;
}
function p3Find(k){var a=window._P3||[];for(var i=0;i<a.length;i++)if(a[i].key===k)return a[i];return null;}
function p3Pick(k){if(k!==P3_SEL)P3_EDIT=false;P3_SEL=k;var x=p3Find(k);document.getElementById('p3-det').innerHTML=x?p3DetHTML(x):'';Array.prototype.forEach.call(document.querySelectorAll('#p3-list .tk-item'),function(b){b.classList.toggle('on',b.getAttribute('data-id')===k);});if(window.innerWidth<=860){var d=document.getElementById('p3-det');if(d)d.scrollIntoView({behavior:'smooth',block:'start'});}}
function p3Search(){P3_Q=(document.getElementById('p3-q')||{}).value||'';document.getElementById('p3-list').innerHTML=p3ListHTML(p3Filtered(window._P3||[]));}
function p3Cat(c){P3_CAT=c;P3_LIMIT=150;render();}
function p3Sort(v){P3_SORT=v;render();}
function p3Save(){
  var x=p3Find(P3_SEL);if(!x)return;var cat=val('p3-ecat').trim(),pre=val('p3-epre');var precio=pre===''?null:Number(pre);
  showLoading();
  var pr=x.prod&&x.prod.id?sb.from('productos').update({categoria:cat,precio:precio}).eq('id',x.prod.id):sb.from('productos').insert({nombre:x.nombre,categoria:cat,precio:precio});
  pr.then(function(r){if(r.error)throw r.error;P3_EDIT=false;return loadAll();}).then(function(){hideLoading();render();}).catch(function(e){hideLoading();alert('No se pudo guardar: '+((e&&e.message)?e.message:e));});
}
function p3Xlsx(rows,sheet,file){if(typeof XLSX==='undefined'){alert('No se cargo la libreria de Excel (revisa tu conexion).');return;}var ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,sheet);XLSX.writeFile(wb,file);}
function p3ExcelCatalogo(){p3Xlsx(p3Filtered(window._P3||[]).map(function(x){return {Producto:x.nombre,Categoria:x.categoria,Precio:x.precio,Pedidos:x.peds,Unidades:x.uds,'Clientes distintos':x.nCli,'Recompra %':x.recompra,'Venta acumulada':x.venta,'Ultimo pedido':x.ult};}),'Productos','Productos_360.xlsx');}

var RP_DEFS={
 ventas:{tag:'Ventas',chip:['#E6F7F0','#0B5E45'],t:'Ventas y utilidad por periodo',d:'Venta, costo de mercancia, gastos y utilidad de cada periodo, contra el periodo anterior.',per:false,

 topprod:{tag:'Productos',chip:['#111','#fff'],t:'Top productos y recompra',d:'Los mas pedidos, cuantos clientes distintos los piden y cuantos los vuelven a pedir.',per:true,

function rpExcel(id){

  var x=rpData(id);var rows=x.d.rows.map(function(row){var o={};row.forEach(function(v,i){var c=x.d.cols[i];o[c[0]]=(c[1]==='pct'&&v!=null)?Math.round(v*10)/10:v;});return o;});
  var ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Reporte');
  var ws2=XLSX.utils.aoa_to_sheet([[x.r.t],[x.per?('Periodo: '+x.per):'Todos los periodos'],[]].concat(x.d.sum));XLSX.utils.book_append_sheet(wb,ws2,'Resumen');
  XLSX.writeFile(wb,safe(x.r.t)+(x.per?'_'+safe(x.per):'')+'.xlsx');
}
function rpPdf(id){

  h+='<table><thead><tr>'+x.d.cols.map(function(c){return '<th class="'+(c[1]!=='text'&&c[1]!=='date'?'num':'')+'">'+c[0]+'</th>';}).join('')+'</tr></thead><tbody>'+
    x.d.rows.map(function(row){return '<tr>'+row.map(function(v,i){var t=x.d.cols[i][1];return '<td class="'+(t!=='text'&&t!=='date'?'num':'')+'">'+rpFmt(v,t)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';

/* ---------- DASHBOARDS (portada ejecutiva + tableros por tema) ---------- */
var DB_TAB='resumen', DB_PER='', DB_CAT='', DB_PROD='', DB_SEG='frec';
var DB_COLORS=['#E5127D','#5FD3B0','#6C5CFF','#F59BC3','#A7E8D3','#7A7F7D','#C9A227','#4B6BFB'];
function dbK(n){n=Number(n)||0;var a=Math.abs(n);return (n<0?'-':'')+'$'+(a>=1000?(a/1000).toFixed(1)+'k':Math.round(a));}
function dbMoney(n){n=Number(n)||0;return (n<0?'-':'')+'$'+Math.round(Math.abs(n)).toLocaleString('en-US');}
function dbShort(p){return String(p).replace(/\s*20\d\d\s*/,' ').replace(/Octubre/,'Oct').replace(/Septiembre/,'Sep').replace(/Agosto/,'Ago').replace(/Noviembre/,'Nov').replace(/Diciembre/,'Dic').replace(/Enero/,'Ene').trim();}
function dbData(){
  var po=p3PerOrder(),cat={};STATE.productos.forEach(function(p){cat[p3Key(p.nombre)]=p.categoria||'Sin categoria';});
  var first={};po.forEach(function(per){STATE.pedidos.forEach(function(p){if(!p.cancelado&&p.periodo===per&&!first[p.cliente])first[p.cliente]=per;});});
  var P={};po.forEach(function(per){P[per]={per:per,venta:0,peds:0,cli:{},nuevos:0,recur:0,costo:0,gasto:0,cats:{},prods:{},saldo:0,pagado:0,emp:0,ent:0,pag:0,tk:0};});
  STATE.pedidos.forEach(function(p){if(p.cancelado||!P[p.periodo])return;var x=P[p.periodo],v=pedVista(p);x.venta+=v.total;x.peds++;x.cli[p.cliente]=1;x.saldo+=Math.max(0,v.saldo);x.pagado+=v.pagado;
    if(p.empacado||p.entregado)x.emp++;if(p.entregado)x.ent++;if(v.saldo<=0.001)x.pag++;if((TK_ENV[String(p.id)]||{}).ticket)x.tk++;
    (p.items||[]).forEach(function(it){var k=p3Key(it.concepto);if(!k)return;var c=cat[k]||'Sin categoria',imp=itemImp(it);x.cats[c]=(x.cats[c]||0)+imp;
      var pr=x.prods[k]||(x.prods[k]={n:String(it.concepto).trim(),cat:c,uds:0,venta:0});pr.uds+=Number(it.cantidad)||0;pr.venta+=imp;});});
  po.forEach(function(per){var x=P[per];Object.keys(x.cli).forEach(function(c){if(first[c]===per)x.nuevos++;else x.recur++;});
    x.costo=(STATE.costos||[]).filter(function(c){return c.periodo===per;}).reduce(function(s,c){return s+(c.mxn||0);},0);
    x.gasto=(STATE.gastos||[]).filter(function(g){return g.periodo===per;}).reduce(function(s,g){return s+(g.mxn||g.monto||0);},0);
    x.util=x.venta-x.costo-x.gasto;x.margen=x.venta?x.util/x.venta*100:0;x.nCli=Object.keys(x.cli).length;x.ticket=x.peds?x.venta/x.peds:0;});
  return {po:po,P:P,cat:cat};
}
function dbDelta(arr,i){if(i<=0||!arr[i-1])return '';var d=(arr[i]-arr[i-1])/Math.abs(arr[i-1])*100;return (d>=0?'&#9650; ':'&#9660; ')+Math.abs(d).toFixed(1)+'%';}
function dbSpark(arr){var mx=Math.max.apply(null,arr),mn=Math.min.apply(null,arr);return arr.map(function(v,j){return (j*(120/Math.max(1,arr.length-1))).toFixed(1)+','+(27-((v-mn)/((mx-mn)||1))*24).toFixed(1);}).join(' ');}

function dbDonut(x){

function packLayoutHTML(list){
  var PAGE_H=255,GAP=4,mm=96/25.4;
  var meas=document.createElement('div');meas.style.cssText='position:absolute;left:-10000px;top:0;zoom:1;visibility:hidden';
  meas.innerHTML=list.map(function(p,i){return '<div data-i="'+i+'">'+labelHTML(p,true)+'</div>';}).join('');
  document.documentElement.appendChild(meas);
  var items=list.map(function(p,i){var el=meas.querySelector('[data-i="'+i+'"]');return {html:labelHTML(p,true),h:el.offsetHeight/mm};});
  meas.remove();
  items.sort(function(a,b){return b.h-a.h;});
  var cols=[];
  items.forEach(function(it){
    var c=null;for(var k=0;k<cols.length;k++){if(cols[k].used+(cols[k].items.length?GAP:0)+it.h<=PAGE_H){c=cols[k];break;}}
    if(!c){c={used:0,items:[]};cols.push(c);}
    c.used+=(c.items.length?GAP:0)+it.h;c.items.push(it);
  });
  var h='';for(var i=0;i<cols.length;i+=2){h+='<div class="ppage">'+[cols[i],cols[i+1]].filter(Boolean).map(function(c){return '<div class="pcol">'+c.items.map(function(x){return x.html;}).join('')+'</div>';}).join('')+'</div>';}
  return {html:h,hojas:Math.ceil(cols.length/2)};
}

function bkRangoOk(f){if(BK_RANGO==='todo'||!f)return true;var d=new Date(f+'T12:00:00'),now=new Date();
  if(BK_RANGO==='7')return (now-d)/864e5<=7;if(BK_RANGO==='30')return (now-d)/864e5<=30;
  if(BK_RANGO==='mes')return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();return true;}
function bkFiltered(){var q=BK_Q.trim().toUpperCase();return (STATE.transferencias||[]).filter(function(t){
  if(BK_TAB==='pend'&&t.estatus!=='pendiente')return false;if(BK_TAB==='asig'&&t.estatus!=='asignado')return false;if(BK_TAB==='ign'&&t.estatus!=='ignorado')return false;
  if(BK_TAB!=='pend'&&!bkRangoOk(t.fecha))return false;
  if(q&&(t.remitente+' '+t.concepto+' '+t.referencia+' '+t.clave+' '+t.institucion).toUpperCase().indexOf(q)<0)return false;return true;
}).sort(function(a,b){return (b.fecha||'').localeCompare(a.fecha||'')||(b.createdAt||0)-(a.createdAt||0);});}

  var enRango=trs.filter(function(t){return t.estatus!=='ignorado'&&bkRangoOk(t.fecha);});
  var sum=function(a){return a.reduce(function(x,t){return x+(Number(t.monto)||0);},0);};
  var rangoTxt={'7':'ultimos 7 dias','30':'ultimos 30 dias',mes:'este mes',todo:'todo'}[BK_RANGO];
  var h='<div class="bk-kpis">';
  h+='<div class="bk-read"><span class="bk-lbl">Lectura del banco</span><b id="ultLect">Ultima lectura: ...</b><span class="bk-note">Automatica todos los dias a las 7:00 a.m.</span><button class="pill pillR" onclick="revisarTransfers()">&#8635; Consultar banco ahora</button></div>';
  h+='<div class="bk-k"><span class="bk-lbl">Recibido &middot; '+rangoTxt+'</span><b>'+mxn(sum(enRango))+'</b><span class="bk-note">'+enRango.length+' movimiento'+(enRango.length!==1?'s':'')+'</span></div>';
  h+='<div class="bk-k bk-pink"><span class="bk-lbl">Por asignar</span><b>'+pend.length+'</b><span class="bk-note">'+mxn(sum(pend))+' sin ligar a un pedido</span></div></div>';
  setTimeout(cargarUltimaLectura,0);
  var nA=trs.filter(function(t){return t.estatus==='asignado'&&bkRangoOk(t.fecha);}).length,nI=trs.filter(function(t){return t.estatus==='ignorado'&&bkRangoOk(t.fecha);}).length;
  var tabs=[['pend','Por asignar',pend.length],['asig','Asignadas',nA],['ign','Ignoradas',nI],['todas','Todas',enRango.length+nI]];
  h+='<div class="tk-tabs">'+tabs.map(function(t){return '<button class="tk-tab'+(BK_TAB===t[0]?' on':'')+'" onclick="bkTab(\''+t[0]+'\')">'+t[1]+' ('+t[2]+')</button>';}).join('');
  h+='<select class="bk-sel" onchange="bkRango(this.value)">'+[['mes','Este mes'],['7','Ultimos 7 dias'],['30','Ultimos 30 dias'],['todo','Todo']].map(function(o){return '<option value="'+o[0]+'"'+(BK_RANGO===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>';
  h+='<input id="bk-q" class="tk-q" placeholder="Buscar ordenante, concepto o clave..." value="'+esc(BK_Q)+'" oninput="bkSearch()"><button class="pill pillR bk-xl" onclick="bkExcel()">Exportar Excel</button></div>';
  h+='<div id="bk-list">'+bkListHTML()+'</div>';
  return h;
}
function bkListHTML(){
  var list=bkFiltered();
  if(!list.length)return BK_TAB==='pend'?emptyBox('Nada por asignar','Todas las transferencias ya estan ligadas a un pedido.'):'<div style="color:var(--inkSoft);padding:20px 4px">Sin movimientos en este filtro.</div>';
  var cl=asgClientes();
  return '<div class="bk-list">'+list.map(function(t){
    var right='';
    if(t.estatus==='pendiente'){var sg=suggestClient(t.remitente,cl);
      right='<div class="bk-st">'+(sg?tkChip('Sugerido: '+esc(sg),'color-mix(in srgb,var(--mint) 22%,white)','#0B5E45'):tkChip('Sin sugerencia','#EEF1F0','#3F4A46'))+'</div><div class="bk-btns"><button class="pill pillR pk-b" onclick="openAsignar(\''+t.id+'\')">Asignar a pedido</button><button class="pill pillO pk-b" onclick="doIgnorar(\''+t.id+'\')">Ignorar</button></div>';}
    else if(t.estatus==='asignado'){var p=byId(STATE.pedidos,t.pedidoId);right='<div class="bk-st">'+tkChip('Asignada','#E6F7F0','#0B5E45')+'</div><div class="bk-ped">'+(p?esc(p.cliente)+' &middot; Folio '+esc(p.folio)+' &middot; '+esc(p.periodo):'Pedido '+esc(t.pedidoId))+'</div>';}
    else right='<div class="bk-st">'+tkChip('Ignorada','#FFF3D6','#7A5300')+'</div><div class="bk-btns"><button class="pill pillO pk-b" onclick="bkRecuperar(\''+t.id+'\')">Regresar a por asignar</button></div>';
    return '<div class="bk-row"><div class="bk-amt"><b>'+mxn(t.monto)+'</b><span>'+fmtDate(t.fecha)+'</span></div>'+
      '<div class="bk-info"><b>'+esc(t.remitente||'(sin nombre)')+'</b><span>'+[t.institucion,t.concepto?'concepto: '+t.concepto:'',t.referencia?'ref: '+t.referencia:''].filter(Boolean).map(esc).join(' &middot; ')+'</span>'+(t.clave?'<span class="bk-clave">Clave '+esc(t.clave)+'</span>':'')+'</div>'+
      '<div class="bk-right">'+right+'</div></div>';
  }).join('')+'</div>';
}
function bkTab(t){BK_TAB=t;render();}
function bkRango(r){BK_RANGO=r;render();}
function bkSearch(){BK_Q=(document.getElementById('bk-q')||{}).value||'';document.getElementById('bk-list').innerHTML=bkListHTML();}
function bkRecuperar(id){showLoading();sb.from('transferencias').update({estatus:'pendiente'}).eq('id',id).then(function(r){if(r.error)throw r.error;return loadAll();}).then(function(){hideLoading();render();}).catch(function(e){hideLoading();alert('Error: '+((e&&e.message)?e.message:e));});}
function bkExcel(){
  if(typeof XLSX==='undefined'){alert('No se cargo la libreria de Excel (revisa tu conexion).');return;}
  var rows=bkFiltered().map(function(t){var p=t.pedidoId?byId(STATE.pedidos,t.pedidoId):null;return {Fecha:t.fecha,Monto:t.monto,Ordenante:t.remitente,'Cuenta origen':t.cuentaOrigen,Institucion:t.institucion,Concepto:t.concepto,Referencia:t.referencia,'Clave de rastreo':t.clave,Estatus:t.estatus,Cliente:p?p.cliente:'',Folio:p?p.folio:'',Periodo:p?p.periodo:''};});
  var ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Banco');XLSX.writeFile(wb,'Banco_'+BK_TAB+'.xlsx');
}
function doIgnorar(id){if(confirm('Marcar como ignorada? (no se asignara a ningun pedido)'))run('ignorarTransferencia',[id],null);}
function norm(x){return String(x||'').toUpperCase().replace(/[ÁÀÄÂ]/g,'A').replace(/[ÉÈËÊ]/g,'E').replace(/[ÍÌÏÎ]/g,'I').replace(/[ÓÒÖÔ]/g,'O').replace(/[ÚÙÜÛ]/g,'U').replace(/Ñ/g,'N').replace(/[^A-Z0-9 ]/g,' ').split(/\s+/).filter(function(w){return w.length>=3;});}
function suggestClient(remitente,clientes){var rw=norm(remitente);if(!rw.length)return '';var best='',bs=0;clientes.forEach(function(c){var cw=norm(c),sc=0;cw.forEach(function(w){if(rw.indexOf(w)>=0)sc++;});if(sc>bs){bs=sc;best=c;}});return bs>0?best:'';}
function asgClientes(){var pend=pedidosConSaldo();var cl=[];pend.forEach(function(p){if(cl.indexOf(p.cliente)<0)cl.push(p.cliente);});cl.sort(function(a,b){return a.localeCompare(b,'es');});return cl;}
function openAsignar(tid){
  var t=byId(STATE.transferencias,tid);if(!t)return;
  var cl=asgClientes();
  if(!cl.length){alert('No hay pedidos con saldo pendiente para asignar.');return;}
  ASG_TID=tid;ASG_AMT=t.monto;window._asgT=t;
  ASG_CLI=suggestClient(t.remitente,cl)||cl[0]||'';
  openModal('Asignar transferencia',asignarBody());
}
function asignarBody(){
  var t=window._asgT;var cl=asgClientes();
  var peds=pedidosConSaldo().filter(function(p){return p.cliente===ASG_CLI;});
  var sug=null;peds.forEach(function(p){if(Math.abs(p.saldo-ASG_AMT)<0.5)sug=p;});
  var pedId=sug?sug.id:(peds[0]?peds[0].id:'');
  var h='<div style="background:var(--greenSoft);border-radius:12px;padding:10px 12px;margin-bottom:14px"><div class="tnum" style="font-weight:800;font-size:16px;color:var(--green)">'+mxn(t.monto)+'</div><div style="font-size:13px;color:var(--ink);font-weight:600">'+esc(t.remitente||'')+'</div><div style="font-size:12px;color:var(--inkSoft)">'+fmtDate(t.fecha)+(t.institucion?' &middot; '+esc(t.institucion):'')+'</div></div>';
  h+='<div class="fld"><label class="lbl">Cliente'+(suggestClient(t.remitente,cl)?' (sugerido por nombre)':'')+'</label><select id="asg-cli" onchange="asgCli()">'+cl.map(function(c){return '<option'+(c===ASG_CLI?' selected':'')+'>'+esc(c)+'</option>';}).join('')+'</select></div>';
  h+='<div class="fld"><label class="lbl">Pedido a abonar</label><select id="asg-ped">'+peds.map(function(p){return '<option value="'+p.id+'"'+(p.id===pedId?' selected':'')+'>'+esc(p.folio)+' &middot; '+esc(p.periodo)+' &middot; saldo '+mxn(p.saldo)+'</option>';}).join('')+'</select></div>';
  h+='<div class="row2"><div class="fld"><label class="lbl">Monto</label><input id="asg-monto" inputmode="decimal" value="'+t.monto+'"></div><div class="fld"><label class="lbl">Fecha</label><input id="asg-fecha" type="date" value="'+((t.fecha&&t.fecha.length===10)?t.fecha:todayISO())+'"></div></div>';
  h+='<button class="btn btnG" onclick="submitAsignar()">Registrar pago y marcar asignada</button>';
  return h;
}
function asgCli(){ASG_CLI=document.getElementById('asg-cli').value;var box=document.querySelector('#modal-root .modal > div:last-child');if(box)box.innerHTML=asignarBody();}
function submitAsignar(){
  var pedId=val('asg-ped');
  var monto=Number(val('asg-monto'))||0;
  var fecha=val('asg-fecha')||todayISO();
  if(!pedId||monto<=0){alert('Elige un pedido y un monto valido.');return;}
  closeModal();
  run('asignarTransferencia',[ASG_TID,pedId,monto,fecha],null);
}

window.addEventListener('load',bootAuth);
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});}</script>
</body>
